<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores Herramentales</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='7' fill='%2307234f'/%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z' transform='translate%280.5 0.5%29 scale%280.95%29' fill='none' stroke='%238FC5CF' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='22.5' cy='22.5' r='6.2' fill='%2307234f' stroke='%238FC5CF' stroke-width='2'/%3E%3Ccircle cx='22.5' cy='22.5' r='2.2' fill='none' stroke='%238FC5CF' stroke-width='1.8'/%3E%3Cpath d='M28.23 24.87L30.63 25.87 M24.87 28.23L25.87 30.63 M20.13 28.23L19.13 30.63 M16.77 24.87L14.37 25.87 M16.77 20.13L14.37 19.13 M20.13 16.77L19.13 14.37 M24.87 16.77L25.87 14.37 M28.23 20.13L30.63 19.13' stroke='%238FC5CF' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Tema oscuro por defecto (sistema de diseño AGP); el claro es un override. */
  :root{
    --brand:#8FC5CF; --brand-dark:#D4EFF3; --on-brand:#0B2F36;
    --navy:#0B1626; --navy-soft:#16263b; --head-text:#e8e8e8; --head-soft:#9fb3c4;
    --teal:#8FC5CF; --teal-deep:#8FC5CF; --teal-pale:#12303a;
    --bg:#07111F; --surface:#0B1626; --border:#213856; --grid:#16263b;
    --text:#e8e8e8; --text-soft:#b9c7d3; --muted:#7f93a6;
    --ok:#78BE8C; --ok-bg:#163527;
    --near:#e0a030; --near-bg:#3a2c10;
    --bad:#EF7B7B; --bad-bg:#3d1a1d;
    --pend:#1d2f45; --tip-bg:#22374f; --tip-text:#ffffff;
    --sombra:0 6px 24px rgba(0,0,0,.35);
    --radius:12px;
    --meta:#F08A7E; --meta-borde:#6b3a36; --meta-bg:#2a1719;
    --font:'Segoe UI',system-ui,sans-serif;
    --mono:var(--font);  /* una sola tipografía: los números usan cifras de ancho fijo (tabular-nums) */
    color-scheme:dark;
  }
  :root[data-tema="claro"]{
    --brand-dark:#07234f;
    --navy:#07234f; --navy-soft:#163a6b; --head-text:#ffffff; --head-soft:#c4d6e4;
    --teal:#5B99A6; --teal-deep:#1a6b7a; --teal-pale:#E8F5F7;
    --bg:#f0f6f8; --surface:#ffffff; --border:#DCDCDC; --grid:#EDF1F2;
    --text:#07234f; --text-soft:#4d6676; --muted:#7d909b;
    --ok:#2f7d4c; --ok-bg:#EAF7EF;
    --near:#b45309; --near-bg:#fef9c3;
    --bad:var(--meta); --bad-bg:#FDECEA;
    --pend:#E4E8EA; --tip-bg:#07234f; --tip-text:#ffffff;
    --sombra:0 4px 18px rgba(7,35,79,.08);
    --meta:#C0392B; --meta-borde:#F2C9C4; --meta-bg:#FDF3F2;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

  /* ---------- encabezado ---------- */
  header{background:var(--navy);color:var(--head-text);border-bottom:3px solid var(--brand);position:sticky;top:0;z-index:20}
  .head-in{max-width:1360px;margin:0 auto;padding:14px 24px 0;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
  .marca{display:flex;align-items:center;gap:12px}
  .marca svg{flex:none}
  .titulo h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.01em}
  .titulo p{margin:2px 0 0;color:var(--head-soft);font-size:13px}
  .frescura{font-size:12px;color:var(--head-soft);text-align:right;line-height:1.4}
  .frescura b{color:var(--head-text);font-weight:600}
  .vivo{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--head-text)}
  .vivo i{width:8px;height:8px;border-radius:50%;background:#78BE8C;box-shadow:0 0 0 0 rgba(120,190,140,.6);animation:pulso 2s infinite}
  .vivo.caido i{background:#DC5353;animation:none}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(120,190,140,.55)}70%{box-shadow:0 0 0 7px rgba(120,190,140,0)}100%{box-shadow:0 0 0 0 rgba(120,190,140,0)}}
  .head-der{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .btn-act{background:var(--brand);color:var(--on-brand);font:700 13px var(--font);padding:9px 16px;border-radius:8px;border:0;cursor:pointer;white-space:nowrap;transition:filter .15s;min-height:38px}
  .btn-act:hover{filter:brightness(1.08)}
  .btn-act.cargando{opacity:.6;pointer-events:none}
  .btn-ico{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--head-text);border-radius:8px;min-width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;font:700 12px var(--font);padding:0 10px}
  .btn-ico:hover{background:rgba(143,197,207,.14)}
  .idioma{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden;height:38px}
  .idioma button{background:transparent;border:0;color:var(--head-soft);font:700 12px var(--font);padding:0 11px;cursor:pointer}
  .idioma button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
  nav.tabs{max-width:1360px;margin:12px auto 0;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
  nav.tabs button{background:transparent;border:0;color:var(--head-soft);font:600 13px var(--font);padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
  nav.tabs button:hover{color:var(--head-text);background:rgba(143,197,207,.09)}
  nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--text);font-weight:700}

  /* ---------- carga / error ---------- */
  .cargando-box{display:grid;place-items:center;gap:14px;padding:90px 20px;color:var(--text-soft)}
  .spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand);animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .aviso .reintentar{margin-left:auto;background:var(--surface);border:1px solid currentColor;color:inherit;border-radius:7px;padding:4px 10px;font:600 12px var(--font);cursor:pointer}

  /* ---------- fuentes de datos ---------- */
  .fuentes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:8px}
  .fuente{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-soft)}
  .fuente b{color:var(--text);font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .fuente .err{color:var(--bad);margin-top:4px}

  /* ---------- mantenimiento: matriz persona x día ---------- */
  .matriz{border-collapse:separate;border-spacing:3px;font-size:12px;width:auto}
  .matriz th{font-size:10.5px;text-align:center;padding:4px 2px;border:0;letter-spacing:0;text-transform:none}
  .matriz th.p{text-align:left}
  .matriz td{padding:0;border:0;text-align:center}
  .matriz td.p{text-align:left;white-space:nowrap;padding-right:8px;font-weight:600;color:var(--text);max-width:190px;overflow:hidden;text-overflow:ellipsis}
  .matriz td.c{width:38px;height:30px;border-radius:6px;font-family:var(--mono);font-weight:600;cursor:default}
  .matriz td.c.cero{color:var(--muted);font-weight:400}
  .matriz td.t{font-family:var(--mono);font-weight:700;padding-left:8px;text-align:right}
  .matriz th.hoy,.matriz td.hoy{outline:2px solid var(--brand);outline-offset:-2px}
  /* análisis por periodo */
  .sec-fila{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:26px 0 10px}
  .sec-fila h2.sec{margin:0}
  .matriz th.zoom{cursor:pointer}
  .matriz th.zoom:hover{color:var(--text);text-decoration:underline}
  .matriz th.nolab{color:var(--muted)}
  .matriz td.c.nolab.cero{background-image:repeating-linear-gradient(135deg,var(--grid) 0 3px,transparent 3px 7px)}
  .matriz td.c.vacio-c{background:transparent;color:var(--border)}
  .matriz tr.pie td{border-top:1px solid var(--border);padding-top:4px;font-weight:700;color:var(--text)}
  .matriz tr.pie td.p,.matriz tr.pie2 td.p{font-weight:600;color:var(--text-soft)}
  .matriz tr.pie2 td{color:var(--text-soft);font-weight:500;text-align:center}
  .matriz th.n,.matriz td.t{white-space:nowrap}
  .pct{display:flex;align-items:center;gap:6px;min-width:120px;padding-left:10px;font-size:12px;color:var(--text-soft)}
  .pct-bar{flex:1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:50px}
  .pct-bar i{display:block;height:100%;border-radius:3px}
  .rk{display:flex;flex-direction:column}
  .rk-fila{display:grid;grid-template-columns:22px minmax(150px,1.2fr) minmax(120px,3fr) 52px 60px 92px 110px;align-items:center;gap:12px;padding:7px 4px;border-bottom:1px solid var(--grid);font-size:12.5px}
  .rk-fila.cab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);padding-top:0}
  .rk-fila.pie{border-bottom:0;border-top:1px solid var(--border);font-weight:700}
  .rk-pos{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--pend);color:var(--text-soft)}
  .rk-fila.top .rk-pos{background:var(--brand);color:var(--on-brand)}
  .rk-nom{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-bar{display:flex;gap:2px;height:14px}
  .rk-bar i{display:block;height:100%}
  .rk-bar i:first-child{border-radius:3px 0 0 3px}
  .rk-bar i:last-child{border-radius:0 3px 3px 0}
  .rk-bar i:only-child{border-radius:3px}
  .rk-n{text-align:right;font-weight:700;color:var(--text);font-size:13.5px}
  .rk-pct,.rk-prom{text-align:right;color:var(--text-soft)}
  @media (max-width:900px){ .rk-fila{grid-template-columns:22px minmax(110px,1fr) minmax(80px,2fr) 44px 52px} .rk-fila > :nth-child(n+6){display:none} }
  .lista-tipo{display:flex;flex-direction:column;gap:2px}
  .lt-fila{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(60px,1.6fr) 44px 46px 96px;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--grid);font-size:12.5px}
  .lt-fila:last-child{border-bottom:0}
  .lt-fila.cab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);padding-top:0}
  .lt-nom{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lt-bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
  .lt-bar i{display:block;height:100%;border-radius:4px}
  .lt-n{text-align:right;font-weight:700;color:var(--text)}
  .lt-pct{text-align:right;color:var(--text-soft)}
  .lt-spark{width:96px;height:22px;display:block}
  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .cat{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--c);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:box-shadow .15s}
  .cat:hover,.cat.sel{box-shadow:var(--sombra)}
  .cat.sel{outline:2px solid var(--c)}
  .cat h4{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .cat .big{font:700 30px/1 var(--font);font-variant-numeric:tabular-nums}
  .cat .big small{font-size:12px;color:var(--text-soft);font-weight:500}
  .top-m{display:flex;flex-direction:column;gap:5px;margin-top:4px;padding-top:10px;border-top:1px solid var(--border)}
  .top-m-tit{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft)}
  .top-m-fila{display:grid;grid-template-columns:16px 7ch minmax(28px,1fr) auto;align-items:center;gap:8px;font-size:12px}
  .top-m-pos{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--pend);color:var(--text-soft)}
  .top-m-fila.primero .top-m-pos{background:var(--c);color:#fff}
  .top-m-nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .top-m-bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
  .top-m-bar i{display:block;height:100%;border-radius:3px;background:var(--c)}
  .top-m-n{font-weight:700;color:var(--text);min-width:22px;text-align:right}
  .top-m-n small{font-weight:500;color:var(--text-soft);margin-left:1px}
  .vacio-m{font-size:12px;color:var(--muted)}
  /* mantenimiento: tarjetas hoy / ayer / ritmo con contexto */
  .grid-mant{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
  .mk{gap:10px}
  .mk .val{font-size:34px}
  .mk-ref{font-size:12.5px;color:var(--text-soft)}
  .mk-ref b{color:var(--text)}
  .rango{position:relative;height:10px;border-radius:5px;background:var(--grid);margin:6px 0 2px}
  .rango-banda{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--pend);outline:1px solid var(--border)}
  .rango-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#5BB0C0}
  .rango-prom{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--text)}
  .rango-val{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
  .rango-ley{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .mk-sep{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px}
  .mk-tit{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft)}
  .catbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--grid)}
  .catbar i{display:block;height:100%}
  .catley{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-soft)}
  .catley span{display:inline-flex;align-items:center;gap:5px}
  .catley i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .catley b{color:var(--text)}
  .tecs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text-soft)}
  .tecs b{color:var(--text)}
  .cat .fila3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11.5px;color:var(--text-soft)}
  .cat .fila3 b{display:block;font:700 15px var(--font);color:var(--text)}
  .sub-aceros{margin-bottom:6px}
  .sub-aceros button{font-size:13px;padding:8px 16px}
  .etq{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--pend);color:var(--text-soft)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

  main{max-width:1360px;margin:0 auto;padding:22px 24px 60px}
  .vista[hidden]{display:none!important}
  .aviso{border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .aviso.err{background:var(--bad-bg);color:var(--bad)}
  .aviso.warn{background:var(--near-bg);color:var(--near)}

  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-soft);font-weight:600;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h2.sec:first-child{margin-top:0}
  h2.sec small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12px}

  /* ---------- resumen ---------- */
  .frase{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:10px;padding:14px 18px;font-size:15px;margin-bottom:18px}
  .grid-serv{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .serv{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .serv:hover{border-color:var(--teal);box-shadow:var(--sombra)}
  .serv h3{margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .serv .big{font:600 34px/1 var(--font);font-variant-numeric:tabular-nums}
  .serv .big small{font-size:15px;color:var(--text-soft);font-weight:500}
  .serv .sub{color:var(--text-soft);font-size:12.5px}
  .serv ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
  .serv ul li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--grid);padding-top:5px}
  .serv ul li span:last-child{font-family:var(--mono);font-weight:500}
  .serv.pend{border-style:dashed;background:transparent;cursor:pointer}
  .serv.pend .big{font-size:15px;color:var(--text-soft);font-weight:600}

  /* resumen: un servicio por fila, a lo ancho */
  .lista-serv{display:flex;flex-direction:column;gap:16px}
  .serv-largo{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--teal);border-radius:12px;padding:16px 20px 18px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .serv-largo:hover{box-shadow:var(--sombra);border-color:var(--teal)}
  .sl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .sl-bloque .desc{font-size:12px;color:var(--text-soft)}
  .serv-largo h3{margin:0;font-size:17px;font-weight:700}
  .serv-largo .ver{font-size:12.5px;font-weight:600;color:var(--teal-deep)}
  .serv-largo.pend{border-left-color:var(--border);border-style:dashed;background:transparent;padding-block:12px}
  .serv-largo.pend .sl-head{margin-bottom:4px}
  .serv-largo.pend > .desc{font-size:12.5px;color:var(--text-soft)}
  .serv-largo.pend h3{color:var(--text-soft)}
  .sl-grid{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(0,1fr));gap:0}
  .sl-bloque{display:flex;flex-direction:column;gap:8px;padding:0 20px;border-left:1px solid var(--grid);min-width:0}
  .sl-bloque:first-child{padding-left:0;border-left:0}
  .sl-bloque .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-soft);font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center}
  .sl-bloque .val{font:600 30px/1 var(--font);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .sl-bloque .val small{font-size:13px;color:var(--text-soft);font-weight:500}
  .mini-flujo{display:flex;align-items:center;gap:4px;margin-top:4px;position:relative}
  .mini-flujo::before{content:"";position:absolute;left:12px;right:12px;top:12px;height:3px;border-radius:2px;background:linear-gradient(90deg,#8FC5CF,#CDBB6E 45%,#D9804B 72%,#B23B3B);opacity:.45}
  .mf{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .mf b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--c);color:var(--t);box-shadow:0 0 0 3px var(--surface)}
  .mf.cero b{background:var(--surface);border:1.5px dashed var(--border);width:14px;height:14px;margin:5px 0}
  .mf i{font-style:normal;font-size:9.5px;color:var(--muted)}
  @media (max-width:1100px){ .sl-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 0} .sl-bloque:nth-child(odd){padding-left:0;border-left:0} }
  @media (max-width:640px){ .sl-grid{grid-template-columns:1fr} .sl-bloque{padding-left:0;border-left:0} }

  /* resumen de aceros: fila + productividad apiladas a la izquierda, gráfica a la derecha */
  .ra-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2.2fr);gap:14px}
  .ra-grid.inv{grid-template-columns:minmax(0,1.55fr) minmax(320px,1.45fr)}   /* gráfica a la izquierda, tabla a la derecha */
  .ra-tabla{display:flex;flex-direction:column;gap:8px}
  .ra-tabla .tabla{max-height:none;overflow:auto}
  .ra-tabla table{font-size:12px}
  .ra-tabla th,.ra-tabla td{padding:6px 6px}
  .ra-tabla td{white-space:nowrap}
  .ra-tabla td.veh{max-width:170px;overflow:hidden;text-overflow:ellipsis}
  .mc{display:flex;flex-direction:column}
  .mc-veh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 2px 4px;font-weight:700;font-size:12px;letter-spacing:.03em;color:var(--text);border-bottom:1px solid var(--border)}
  .mc-veh:first-child{padding-top:2px}
  .mc-n{font-size:11.5px;font-weight:600;color:var(--text-soft);white-space:nowrap}
  .mc-fila{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 2px 6px 14px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--grid)}
  .mc-f{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--grid);color:var(--text-soft);white-space:nowrap}
  .mc-f.hoy{background:var(--brand);color:var(--on-brand)}
  .mc-f.venc{background:var(--bad-bg);color:var(--bad)}
  .mc-sec{margin-top:14px;padding:6px 2px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);border-bottom:1px solid var(--border)}
  .mc-fila.sin{padding-left:2px;color:var(--text-soft)}
  .mc-set{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px dashed var(--border);white-space:nowrap}
  .ra-tabla tr.sep-fila td{background:var(--brand);color:var(--on-brand);font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center;font-size:11px}
  .ra-col{display:grid;gap:14px;align-content:start}
  .ra-col .kpi,.ra-chart{background:var(--bg);border-color:var(--grid)}
  .cp-prio{display:flex;gap:14px;margin-bottom:3px}
  .cp-p b{font-size:15px;color:var(--text)}
  .fila-hero{display:flex;align-items:center;gap:12px}
  .num-hero{font:700 52px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--text)}
  .fila-hero span:last-child{font-size:13px;line-height:1.25;color:var(--text-soft);font-weight:600}
  .fila-dias{display:grid;gap:8px;font-size:13px;color:var(--text-soft)}
  .fila-dias b.num{font:700 20px var(--font);color:var(--text)}
  .fila-tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--grid);padding-top:10px}
  .fila-tres > div{display:flex;flex-direction:column;gap:2px}
  .fila-tres b.num{font:700 30px/1 var(--font);font-variant-numeric:tabular-nums}
  .fila-tres .mini-in{font-size:30px;font-weight:700;line-height:1.1;height:auto;padding:0;vertical-align:bottom;color:var(--meta);border-bottom-color:var(--meta-borde);width:2.2ch;text-align:left}
  .fila-tres b.num.meta-txt{display:block;line-height:1}
  .fila-tres span{font-size:12px;color:var(--text-soft);font-weight:600}
  .sem-tit{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--text-soft)}
  .sem-tit b{font-size:16px;letter-spacing:0}
  .fila-dias .meta-txt{color:var(--meta);font-weight:600}
  .fila-dias .mini-in{font-size:16px;color:var(--meta);border-bottom-color:var(--meta-borde)}
  .bullet.grande{height:14px;border-radius:7px}
  .bullet.grande i{border-radius:7px}
  .bullet.grande b{width:3px;top:-5px;bottom:-5px}
  .mini-in{width:3ch;border:0;border-bottom:2px dashed var(--border);background:transparent;font-family:var(--font);font-weight:700;font-size:inherit;line-height:1;color:var(--text);text-align:center;outline:none;padding:0}
  .kpi .val .mini-in{font-size:22px;color:var(--meta);border-bottom-color:var(--meta-borde)}
  .meta-in .mini-in{font-size:18px;color:var(--meta);border-bottom-color:var(--meta-borde);width:4ch}
  .mini-in:focus{border-bottom-style:solid}
  /* casillas de capacidad por semana, alineadas bajo cada barra (margen izq. 34 px y der. 8 px como la gráfica) */
  .cap-fila{position:relative;padding:2px 8px 0 34px}
  .cap-fila:empty{display:none}
  .cap-tit{position:absolute;left:0;top:6px;font-size:9.5px;font-weight:700;color:var(--meta);writing-mode:vertical-rl;transform:rotate(180deg);height:30px;text-align:center}
  .cap-celdas{display:grid;border-top:1px dashed var(--meta-borde);padding-top:4px}
  .cap-celdas span{display:flex;justify-content:center}
  .cap-celdas .mini-in{width:100%;max-width:46px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px dashed var(--border);padding:3px 0}
  .cap-celdas .mini-in::placeholder{color:var(--muted);font-weight:500}
  .cap-celdas .propia .mini-in{color:var(--meta);font-weight:700;border-bottom-color:var(--meta-borde)}
  @media (max-width:1000px){ .ra-grid{grid-template-columns:1fr} }

  /* ---------- chips de estado (siempre ícono + texto) ---------- */
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.near{background:var(--near-bg);color:var(--near)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .chip.neutral{background:var(--pend);color:var(--text-soft)}

  /* ---------- tarjetas KPI ---------- */
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-soft);font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 8px;align-items:center}
  .kpi .val{font:600 30px/1 var(--font);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .kpi .val small{font-size:13px;color:var(--text-soft);font-weight:500}
  .kpi .desc{font-size:12px;color:var(--text-soft)}
  .bullet{position:relative;height:10px;background:var(--grid);border-radius:5px;margin-top:2px}
  .bullet i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal)}
  .bullet b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
  .kpi.hero{border-top:3px solid var(--teal)}
  .kpi.manual .val-input{font:600 30px/1 var(--mono);color:var(--text);width:4.2ch;min-width:2ch;border:0;border-bottom:2px dashed var(--border);background:transparent;padding:0 0 2px;outline:none;font-family:var(--font);font-variant-numeric:tabular-nums}
  .kpi.manual .val-input:hover{border-bottom-color:var(--teal)}
  .kpi.manual .val-input:focus{border-bottom:2px solid var(--teal)}
  .kpi.manual .val-input::placeholder{color:var(--muted)}
  .lapiz{color:var(--muted);font-size:14px;margin-left:auto}
  .btn-volver{border:1px solid var(--border);background:var(--surface);color:var(--teal-deep);font:600 12px var(--font);padding:6px 12px;border-radius:7px;cursor:pointer}
  .btn-volver:hover{border-color:var(--teal)}
  .prod-ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .meta-in{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--meta);border:1px solid var(--meta-borde);background:var(--meta-bg);border-radius:8px;padding:4px 10px}
  .meta-in input{width:4ch;border:0;border-bottom:2px dashed var(--meta-borde);background:transparent;font:700 18px var(--font);color:var(--meta);text-align:center;outline:none;padding:0}
  .meta-in input:focus{border-bottom:2px solid var(--meta)}
  .chart text.v.halo{paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;pointer-events:none}
  .chart text.linea-num{font-weight:700;font-family:var(--mono);font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
  .chart text.meta-num{fill:var(--meta);font-weight:700;font-family:var(--mono);font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:3px}

  /* línea de proceso: piezas sin acero en planta */
  .flujo-tot{font-size:13px;color:var(--text-soft);margin:6px 0 4px}
  .flujo-tot span{font:600 26px/1 var(--font);color:var(--text);margin-right:6px;vertical-align:-3px}
  .flujo{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:26px 0 6px}
  .flujo-riel{position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));top:calc(26px + var(--d) / 2 - 3px);height:6px;border-radius:3px;
    background:linear-gradient(90deg,#8FC5CF,#CDBB6E 45%,#D9804B 72%,#B23B3B);opacity:.45}
  .flujo{--d:clamp(36px,4.4vw,58px)}
  .nodo{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:inherit;position:relative;z-index:1}
  .nodo .circ{width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;font-size:clamp(13px,1.3vw,18px);font-weight:700;
    background:var(--c);color:var(--t);box-shadow:0 0 0 4px var(--surface);transition:transform .15s}
  .nodo .nom{font-size:11.5px;color:var(--text);font-weight:600;text-align:center}
  .nodo.cero .circ{background:var(--surface);color:var(--muted);border:2px dashed var(--border);transform:scale(.72)}
  .nodo.cero .nom{color:var(--muted);font-weight:500}
  .nodo:hover .circ{transform:scale(1.08)}
  .nodo.cero:hover .circ{transform:scale(.8)}
  .nodo.sel .circ{outline:3px solid var(--text);outline-offset:3px}
  .nodo.late .circ{animation:latido 1.4s ease-out infinite}
  @keyframes latido{0%{box-shadow:0 0 0 4px var(--surface),0 0 0 4px rgba(178,59,59,.55)}100%{box-shadow:0 0 0 4px var(--surface),0 0 0 18px rgba(178,59,59,0)}}
  @media (prefers-reduced-motion:reduce){ .nodo.late .circ{animation:none;outline:3px solid #B23B3B;outline-offset:3px} }

  /* X5: aceros en fabricación por pieza */
  .x5-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:4px}
  .x5-p{border:1px solid var(--grid);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
  .x5-nom{font-size:11.5px;color:var(--text-soft);font-weight:600;line-height:1.25;min-height:2.5em}
  .x5-p .val-input{font-size:24px!important;width:3.5ch}
  .x5-tot{font-size:12px;color:var(--text-soft);text-transform:none;letter-spacing:0}
  .x5-tot b{font:700 20px var(--font);color:var(--text);margin-left:6px}
  .multi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .multi > div + div{border-left:1px solid var(--grid);padding-left:12px}
  .multi .desc{margin-top:4px}
  table.tx5{margin-top:8px;font-size:12px}
  table.tx5 th{font-size:10.5px;padding:5px 4px;letter-spacing:.04em}
  table.tx5 td{padding:4px;color:var(--text)}
  table.tx5 tr.tot td{font-weight:700;border-top:1px solid var(--border);border-bottom:0}
  .grid-estado{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  /* estado actual de aceros en una sola fila */
  .grid-estado1{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(4,minmax(0,1fr));gap:14px}
  .grid-estado1 .kpi{padding:14px 16px}
  .grid-estado1 .kpi .val{font-size:26px}
  @media (max-width:1200px){ .grid-estado1{grid-template-columns:repeat(3,minmax(0,1fr))} .grid-estado1 > :first-child{grid-column:span 3} }
  @media (max-width:640px){ .grid-estado1{grid-template-columns:1fr} .grid-estado1 > :first-child{grid-column:auto} }
  /* no cumplidos por puesto */
  .puestos{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .pu-fila{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;align-items:center;gap:8px;font-size:12.5px}
  .pu-nom{color:var(--text);font-weight:600;white-space:nowrap}
  .pu-bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
  .pu-bar i{display:block;height:100%;border-radius:4px}
  .pu-n{text-align:right;font-weight:700;color:var(--text)}
  .cap-seri{font-size:12px;font-weight:600;color:var(--meta);white-space:nowrap}
  .cap-seri .mini-in{font-size:15px;color:var(--meta);border-bottom-color:var(--meta-borde)}
  #comp-detalle{margin-top:10px}
  .ents{display:flex;flex-wrap:wrap;gap:4px}
  .ent{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:var(--ok-bg);color:var(--text);white-space:nowrap}
  .ent.tarde{background:var(--bad-bg)}
  .ent b{margin-left:2px}
  /* piezas retenidas / refundidas en piso */
  .ret-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
  .ret-form input,.ret-form select,.ret-tabla select{font:500 13px var(--font);color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
  .ret-form input{width:150px}
  .ret-form button{background:var(--brand);color:var(--on-brand);border:0;border-radius:7px;padding:7px 14px;font:700 12.5px var(--font);cursor:pointer}
  .ret-form button:disabled{opacity:.5;cursor:default}
  .ret-prev{font-size:12px;color:var(--text-soft);min-height:18px;margin-bottom:6px}
  .ret-prev b{color:var(--text)}
  .ret-kpis{display:flex;gap:18px;font-size:12.5px;color:var(--text-soft);margin-bottom:6px}
  .ret-kpis b{font-size:18px;color:var(--text);margin-right:4px}
  .ret-tabla td{white-space:nowrap}
  .ret-tabla .marca{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700;font-size:12px}
  .ret-tabla .borrar{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px}
  .ret-tabla .borrar:hover{color:var(--bad)}
  /* fila de tarjetas manuales: enviados | en fabricación | X5 por pieza (más ancha) */
  .grid-manual{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,3fr);gap:14px;margin-top:14px}
  .lado{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:24px;align-items:start}
  @media (max-width:1000px){
    .grid-estado{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-manual{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-manual .m-x5{grid-column:1 / -1}
  }
  @media (max-width:640px){ .grid-estado,.grid-manual{grid-template-columns:1fr} .lado{grid-template-columns:1fr;gap:10px} }
  .registro.viejo{color:var(--near);font-weight:600}
  .grid-ayer{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  .grid-ayer .span2{grid-column:span 2}
  @media (max-width:1100px){ .grid-ayer{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:640px){ .grid-ayer{grid-template-columns:1fr} .grid-ayer .span2{grid-column:auto} }

  .no-cump{margin-top:8px}
  .no-cump summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--teal)}
  .no-cump .tabla{max-height:240px;overflow:auto;margin-top:6px}
  /* barra fabricado vs. proyectado */
  .proy{position:relative;padding-top:22px;margin-top:2px}
  .proy-bar{display:flex;gap:2px;height:26px;background:var(--grid);border-radius:6px;overflow:hidden}
  .proy-bar i{display:flex;align-items:center;justify-content:center;height:100%;font:600 12px var(--mono);color:#0B1626;font-style:normal;white-space:nowrap;overflow:hidden}
  .proy-bar i:last-child{border-radius:0 6px 6px 0}
  i.proy-falta{background:repeating-linear-gradient(135deg,var(--pend) 0 6px,var(--grid) 6px 12px);color:var(--text-soft)!important;font-weight:500!important}
  .proy-marca{position:absolute;top:2px;bottom:-4px;width:2px;background:var(--text);transform:translateX(-1px);z-index:1}
  .proy-marca span{position:absolute;top:-2px;right:6px;font-size:11.5px;color:var(--text-soft);white-space:nowrap}
  .proy-marca span b{color:var(--text)}
  .proy-ley{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--text-soft);margin-top:12px}
  .proy-ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .proy-ley b{color:var(--text);font-weight:600;margin-left:2px}

  /* matriceros */
  .matr{display:grid;gap:9px;margin-top:4px}
  .matr-fila{display:grid;grid-template-columns:minmax(110px,165px) 1fr 52px 64px;align-items:center;gap:12px;font-size:13px}
  .matr-nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .matr-nom.sin{color:var(--muted);font-style:italic}
  .matr-bar{position:relative;height:22px;background:var(--grid);border-radius:5px}
  .matr-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;display:flex;align-items:center;justify-content:flex-start;min-width:30px}
  .matr-bar i em{font-style:normal;font-weight:600;font-size:12.5px;color:var(--text);padding-left:9px}
  .matr-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
  .matr-meta{color:var(--text-soft);font-size:12.5px;white-space:nowrap}
  .matr-meta b{color:var(--text);font-weight:600}
  .matr-e{font-size:11.5px;font-weight:600;white-space:nowrap;text-align:right}
  .matr-tot{border-top:1px solid var(--border);padding-top:8px;font-weight:600}
  .ra-col .matr-fila{grid-template-columns:minmax(70px,1fr) minmax(80px,1.5fr) auto 54px;gap:8px;font-size:12.5px}
  .matr-bar em.cero{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:600;font-size:12.5px;color:var(--muted)}

  /* ---------- paneles y gráficas ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:0}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .panel-head h3{margin:0;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .panel-head p{margin:2px 0 0;font-size:12.5px;color:var(--text-soft)}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;margin-top:16px}
  .seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;font:600 12px var(--font);color:var(--text-soft);padding:6px 12px;border-radius:6px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-soft);margin:4px 0 6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .legend i.linea{height:2px;width:14px;border-radius:1px;background:var(--text)}
  .legend i.linea.puntos{width:18px;height:3px;background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}
  .legend i.linea.punteada{width:18px;height:2.5px;background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 8px)}
  .chart{width:100%;position:relative;overflow-x:auto}
  .chart svg{display:block}
  .chart text{font-family:var(--font);fill:var(--text-soft);font-size:11px;font-variant-numeric:tabular-nums}
  .chart text.v{fill:var(--text);font-weight:600;font-family:var(--mono)}
  .hit{fill:transparent;cursor:pointer}
  .hit:hover{fill:rgba(91,153,166,.08)}

const leerPref = (k, d) => { try { return localStorage.getItem(k) || d; } catch(e){ return d; } };

// ---------------------------------------------------------------- utilidades
// Paleta corporativa AGP: el aguamarina de la marca es el color principal. Lo acompañan tonos de matices distintos
// (navy, salvia, rosa viejo, azul acero, oliva) pero con la MISMA saturación suave del aguamarina, para que no se
// confundan entre sí y ninguno grite. Cada tema tiene sus tonos (el 2.º es siempre el de mayor contraste).
// Validada con simulación de daltonismo (OKLab): los 6 colores se separan ≥ 9 entre TODOS los pares.
const PALETAS = {
  claro:  ['#5BB0C0', '#0F3D5E', '#B6C688', '#BE7A7A', '#5472A3', '#6F6424'],
  oscuro: ['#5BB0C0', '#DCE3EA', '#7A884C', '#DD9C85', '#2F698F', '#7D432F'],
};
const OTROS = {claro:'#D5DADF', oscuro:'#707377'};
let PALETA = PALETAS.oscuro, COLOR_OTRO = OTROS.oscuro;
// texto blanco sobre colores oscuros, navy sobre los claros
const tintaSobre = hex => { const h = String(hex).replace('#',''); if(h.length !== 6) return '#0B1626';
  const [r,g,b] = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255);
  return 0.2126*r + 0.7152*g + 0.0722*b < 0.42 ? '#ffffff' : '#0B1626'; };
let COLOR_MAT = {}, COLOR_CAT = {}, COLOR_X5 = {}, COLOR_RET = {}, COLOR_SCR = {}, PALETA_PERSONAS = [], COLOR_HERR = {};
// asigna los colores de cada gráfica según el tema actual (se llama al dibujar y al cambiar de tema)
function aplicarPaleta(){
  const tema = document.documentElement.dataset.tema === 'claro' ? 'claro' : 'oscuro';
  PALETA = PALETAS[tema]; COLOR_OTRO = OTROS[tema];
  COLOR_MAT = {'Böhler':PALETA[0],'Inox 2,5mm':PALETA[1],'Galvanizado 0,3mm':PALETA[2],'Inox 3mm':PALETA[3],
               'Inox 1mm':PALETA[4],'Gurkha':PALETA[5],'Otro':COLOR_OTRO};
  COLOR_CAT = {'Retrofit':PALETA[0], 'BMW X5':PALETA[1], 'Express Van':PALETA[4], 'Land Rover Sentinel':PALETA[2], 'BMW Serie 7':PALETA[3]};
  COLOR_X5 = {'Matricería':PALETA[0], 'Calidad (piso)':PALETA[1]};
  COLOR_RET = {'Falta de archivo (Vitrojet)':PALETA[0], 'Falta de malla':PALETA[1]};
  COLOR_SCR = {'Mallas':PALETA[0], 'Logos':PALETA[1], 'Trazabilidades':PALETA[3]};
  PALETA_PERSONAS = [...PALETA, COLOR_OTRO];
  COLOR_HERR = {'Molde':PALETA[0], 'Galga':PALETA[1], 'Otro':COLOR_OTRO};
}
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const $ = (s, el=document) => el.querySelector(s);
const fmt = (n, d=0) => (n==null || isNaN(n)) ? '—' : Number(n).toLocaleString('es-CO',{minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha = iso => { const [y,m,d] = iso.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const fCorta = iso => { const f = fecha(iso); return `${DIAS[f.getDay()]} ${f.getDate()}`; };
const fLarga = iso => { const f = fecha(iso); return `${DIAS_L[f.getDay()]} ${f.getDate()} de ${MESES[f.getMonth()].toLowerCase()}`; };
const fHora = iso => { const f = new Date(iso); return f.toLocaleString('es-CO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };

// Semáforo: desde 98 % (lo que se ve redondeado como 98 %, ≥ 97,5 %) cumple en verde; >=90 % cerca; <90 % bajo meta. "menos" invierte la lógica.
function estado(real, meta, menosEsMejor=false){
  if(!meta) return {cls:'neutral', txt:'Sin meta', ico:'○', pct:null};
  const pct = real/meta;
  const r = menosEsMejor ? (real<=meta ? 1 : meta/real) : pct;
  const p = menosEsMejor ? null : pct; // en "menos es mejor" un % confunde: solo se muestra el estado
  if(r>=.975) return {cls:'ok', txt: menosEsMejor?'Dentro del promedio':'Cumple', ico:'▲', pct:p};
  if(r>=.9) return {cls:'near', txt:'Cerca', ico:'●', pct:p};
  return {cls:'bad', txt: menosEsMejor?'Sobre el promedio':'Bajo meta', ico:'▼', pct:p};
}
const chip = e => `<span class="chip ${e.cls}" title="${e.txt}">${e.ico} ${e.txt}${e.pct!=null?` · ${fmt(e.pct*100)} %`:''}</span>`;
const COLOR_EST = {ok:'var(--ok)', near:'var(--near)', bad:'var(--bad)', neutral:'var(--text-soft)'};

// ---------------------------------------------------------------- tooltip
const tip = $('#tip');
function mostrarTip(ev, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if(x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if(y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
const ocultarTip = () => tip.style.opacity = 0;
function tipSegs(titulo, segs, extra='', esc_={}){
  const orden = esc_.orden || D.orden_materiales, colores = esc_.colores || COLOR_MAT;
  const filas = orden.filter(m => segs && segs[m]).map(m =>
    `<div class="r"><span><i style="background:${colores[m]}"></i>${(esc_.nombres || {})[m] || m}</span><span>${fmt(segs[m])}</span></div>`).join('');
  return `<b>${titulo}</b>${filas ? '<div style="margin-top:6px">'+filas+'</div>' : ''}${extra}`;
}

// ---------------------------------------------------------------- gráficas SVG
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function escalaEje(v){ // eje Y ajustado: paso "redondo" (1, 2, 2,5, 5, 10 × 10ⁿ) y techo = primer múltiplo del paso ≥ v
  if(v<=0) return {max:4, paso:1};
  const bruto = v/5, p = Math.pow(10, Math.floor(Math.log10(bruto))), n = bruto/p;
  const paso = Math.max(1, (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p);
  return {max: paso*Math.ceil(v/paso), paso};
}

/* Barras apiladas por material.
   items: [{etiqueta, segs, total, meta?, fondo?, sub?, tip?}] - "fondo" dibuja una barra gris detrás (ej. comprometidos). */
function barrasApiladas(cont, items, o={}){
  cont.innerHTML = '';
  if(!items.length){ cont.innerHTML = '<div class="vacio">Sin datos</div>'; return; }
  const lineas = o.lineas || []; // [{vals:[n|null por barra], color, etiquetas:'todas'|'ultima'}] mismo eje que las barras
  const refs = (o.referencias || []).filter(r => r.valor != null); // líneas horizontales de referencia (ej. mediana)
  const maxLineas = Math.max(0, ...lineas.flatMap(l => l.vals.filter(v => v != null)), ...refs.map(r => r.valor));
  const eje = escalaEje(Math.max(maxLineas, ...items.map(i => Math.max(i.total||0, i.meta||0, i.fondo||0))) * 1.08), max = eje.max;
  const mL = Math.max(34, fmt(max, eje.paso % 1 ? 1 : 0).length * 7 + 12); // margen según el número más largo del eje
  const H = o.alto || 260, mR = 8, mB = o.sub ? 44 : 28;
  const W = Math.max(cont.clientWidth || 600, items.length*38 + mL + mR);
  const banda = (W - mL - mR) / items.length, bw = Math.min(46, banda*.62);
  // "hechos/meta" que no cabe en el ancho de la barra se parte en dos renglones ("1.050" y "de 1.063")
  const partir = t => typeof t === 'string' && t.includes('/') && t.length * 7.2 > banda - 2;
  const dosRenglones = items.some(it => partir(it.etiquetaValor));
  const mT = (o.metaRoja ? 36 : 20) + (dosRenglones ? 13 : 0);
  const y = v => mT + (H - mT - mB) * (1 - v/max);
  const svg = svgEl('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label': o.aria || 'Gráfica de barras'}, cont);

  for(let v = 0; v <= max + 1e-9; v += eje.paso){ // cuadrícula recesiva, una línea por paso
    const yy = y(v);
    svgEl('line', {x1:mL, x2:W-mR, y1:yy, y2:yy, stroke: v ? 'var(--grid)':'var(--border)'}, svg);
    svgEl('text', {x:mL-6, y:yy+3.5, 'text-anchor':'end'}, svg).textContent = fmt(v, eje.paso % 1 ? 1 : 0);
  }
  items.forEach((it, i) => {
    const cx = mL + banda*i + banda/2, x = cx - bw/2, g = svgEl('g', {}, svg);
    if(it.fondo){ // pendiente (gris) detrás
      svgEl('rect', {x, y:y(it.fondo), width:bw, height:Math.max(0, y(0)-y(it.fondo)), rx:4, fill:'var(--pend)'}, g);
    }
    let acc = 0;
    const mats = (o.orden || D.orden_materiales).filter(m => it.segs && it.segs[m]);
    mats.forEach((m, j) => {
      const v = it.segs[m], y1 = y(acc+v), y0 = y(acc);
      const top = j === mats.length-1;
      // separador de 2 px entre segmentos; el extremo superior va redondeado
      const color = o.color || (o.colores || COLOR_MAT)[m];
      svgEl('rect', {x, y:y1, width:bw, height:Math.max(1, y0-y1-(acc?2:0)), rx: top?4:0, fill:color}, g);
      if(top && y0-y1 > 6) svgEl('rect', {x, y:y1+4, width:bw, height:Math.max(0,y0-y1-4-(acc?2:0)), fill:color}, g);
      if(o.numSegmentos && y0 - y1 >= 13 && bw >= 14) // número de cada tramo, centrado y con tinta legible sobre su color
        svgEl('text', {x:x + bw/2, y:(y0 + y1)/2 + 4, 'text-anchor':'middle', style:`fill:${tintaSobre(color)};font-size:10.5px;font-weight:700`, 'pointer-events':'none'}, g).textContent = fmt(v);
      acc += v;
    });
    const tope = Math.max(it.total||0, it.fondo||0);
    let yTot = y(tope)-6, yMeta = it.meta ? y(it.meta)-6 : null;
    if(yMeta !== null && o.metaRoja && Math.abs(yTot - yMeta) < 14){ // que el número de la meta no pise el total
      if(yMeta <= yTot) yMeta = yTot - 14; else yTot = yMeta - 14;
    }
    if(it.meta){
      const colorMeta = o.metaRoja ? COLOR_META : 'var(--text)';
      svgEl('line', {x1:cx-bw/2-5, x2:cx+bw/2+5, y1:y(it.meta), y2:y(it.meta), stroke:colorMeta, 'stroke-width':2.5, 'stroke-linecap':'round'}, g);
      if(o.metaRoja) svgEl('text', {x:cx, y:yMeta, 'text-anchor':'middle', class:'meta-num'}, g).textContent = fmt(it.meta);
    }
    if(partir(it.etiquetaValor)){
      const [hecho, meta] = it.etiquetaValor.split('/');
      svgEl('text', {x:cx, y:yTot-13, 'text-anchor':'middle', class:'v'}, g).textContent = hecho;
      svgEl('text', {x:cx, y:yTot, 'text-anchor':'middle', class:'v', style:'fill:var(--text-soft);font-weight:500'}, g).textContent = 'de ' + meta;
    } else svgEl('text', {x:cx, y:yTot, 'text-anchor':'middle', class:'v'}, g).textContent = it.etiquetaValor ?? fmt(it.total);
    svgEl('text', {x:cx, y:H-mB+16, 'text-anchor':'middle'}, g).textContent = it.etiqueta;
    if(o.sub && it.sub){
      const t = svgEl('text', {x:cx, y:H-mB+32, 'text-anchor':'middle', 'font-weight':600, style:`fill:${it.subColor||'var(--text-soft)'}`}, g);
      t.textContent = it.sub;
    }
    const hit = svgEl('rect', {x:mL+banda*i, y:mT-10, width:banda, height:H-mT-mB+10, class:'hit'}, svg);
    hit.addEventListener('mousemove', ev => mostrarTip(ev, it.tip || tipSegs(it.etiqueta, it.segs, '', o)));
    hit.addEventListener('mouseleave', ocultarTip);
    if(o.onClick) hit.addEventListener('click', () => o.onClick(it, i));
  });
  // líneas sobre las barras (2 px, puntos con anillo del color de fondo); se cortan donde no hay dato
  lineas.forEach(l => {
    const pts = l.vals.map((v, i) => v == null ? null : [mL + banda*i + banda/2, y(v)]);
    let tramo = [];
    const cerrar = () => { if(tramo.length > 1) svgEl('polyline', {points:tramo.map(p=>p.join(',')).join(' '), fill:'none', stroke:l.color, 'stroke-width':2.5, 'stroke-linejoin':'round', 'stroke-linecap': l.punteada === 'puntos' ? 'round' : 'butt',
      'stroke-dasharray': l.punteada === 'puntos' ? '0.1 6' : l.punteada ? '6 4' : '', 'pointer-events':'none'}, svg); tramo = []; };
    pts.forEach(p => { if(p) tramo.push(p); else cerrar(); }); cerrar();
    const ultimo = pts.map((p,i)=>p?i:-1).filter(i=>i>=0).pop();
    pts.forEach((p, i) => {
      if(!p) return;
      if(!l.sinPuntos) svgEl('circle', {cx:p[0], cy:p[1], r:4.5, fill:l.color, stroke:'var(--surface)', 'stroke-width':2, 'pointer-events':'none'}, svg);
      if(l.etiquetas === 'todas' || i === ultimo)
        svgEl('text', {x:p[0], y:p[1] + (l.abajo ? 16 : -9), 'text-anchor':'middle', class:'linea-num', style:`fill:${l.color}`, 'pointer-events':'none'}, svg).textContent = fmt(l.vals[i]);
    });
  });
  refs.forEach(r => { // de lado a lado, punteada, con su etiqueta arriba a la derecha
    const yy = y(r.valor);
    svgEl('line', {x1:mL, x2:W-mR, y1:yy, y2:yy, stroke:r.color, 'stroke-width':1.8, 'stroke-dasharray':'6 4', 'pointer-events':'none'}, svg);
    svgEl('text', {x:W-mR, y:yy-6, 'text-anchor':'end', class:'linea-num', style:`fill:${r.color}`, 'pointer-events':'none'}, svg).textContent = r.etiqueta;
  });
  if(lineas.length || refs.length) svg.querySelectorAll('text.v').forEach(t => { t.classList.add('halo'); svg.appendChild(t); }); // totales por encima de las líneas
}

/* Barras agrupadas: una barra por serie (ej. vehículo) dentro de cada periodo, con su número encima.
   items: [{etiqueta, valores:{serie:n}, sub, subColor, tip}]  o: {orden, colores, nombres, alto, aria, onClick, referencias} */
function barrasAgrupadas(cont, items, o={}){
  cont.innerHTML = '';
  if(!items.length){ cont.innerHTML = '<div class="vacio">Sin datos</div>'; return; }
  const series = o.orden.filter(s => items.some(it => it.valores[s]));
  const refs = (o.referencias || []).filter(r => r.valor != null);
  const eje = escalaEje(Math.max(1, ...items.flatMap(it => series.map(s => it.valores[s] || 0)), ...refs.map(r => r.valor)) * 1.12), max = eje.max;
  const mL = Math.max(34, fmt(max).length * 7 + 12), mR = 8, mT = 22, mB = 44, H = o.alto || 280;
  const W = Math.max(cont.clientWidth || 600, items.length * Math.max(1, series.length) * 16 + mL + mR);
  const y = v => mT + (H - mT - mB) * (1 - v / max);
  const banda = (W - mL - mR) / items.length, grupo = Math.min(banda * .74, series.length * 30), bw = Math.max(4, grupo / Math.max(1, series.length) - 3);
  const svg = svgEl('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label': o.aria || 'Gráfica de barras agrupadas'}, cont);
  for(let v = 0; v <= max + 1e-9; v += eje.paso){
    svgEl('line', {x1:mL, x2:W-mR, y1:y(v), y2:y(v), stroke: v ? 'var(--grid)' : 'var(--border)'}, svg);
    svgEl('text', {x:mL-6, y:y(v)+3.5, 'text-anchor':'end'}, svg).textContent = fmt(v);
  }
  const numeros = bw >= 8, fuenteNum = bw < 14 ? 9 : 10.5; // el número va encima de cada barra (más pequeño si es angosta)
  items.forEach((it, i) => {
    const cx = mL + banda * i + banda / 2, x0 = cx - (series.length * (bw + 3) - 3) / 2, g = svgEl('g', {}, svg);
    if(i % 2 === 0) svgEl('rect', {x:mL + banda * i, y:mT - 6, width:banda, height:y(0) - mT + 6, fill:'var(--grid)', opacity:.45, rx:4}, g);
    series.forEach((s, j) => {
      const v = it.valores[s] || 0, x = x0 + j * (bw + 3), h = Math.max(v ? 1.5 : 0, y(0) - y(v));
      if(v) svgEl('rect', {x, y:y(0) - h, width:bw, height:h, rx: Math.min(4, bw / 3), fill:o.colores[s]}, g);
      if(v && numeros) svgEl('text', {x:x + bw / 2, y:y(v) - 4, 'text-anchor':'middle', class:'v', style:`font-size:${fuenteNum}px`}, g).textContent = fmt(v);
    });
    svgEl('text', {x:cx, y:H-mB+16, 'text-anchor':'middle'}, g).textContent = it.etiqueta;
    const sub = it.sub && it.sub.length * 6.2 > banda - 4 && it.subCorto != null ? it.subCorto : it.sub;   // si no cabe, la versión corta
    if(sub) svgEl('text', {x:cx, y:H-mB+32, 'text-anchor':'middle', 'font-weight':600, style:`fill:${it.subColor || 'var(--text-soft)'}`}, g).textContent = sub;
    const hit = svgEl('rect', {x:mL + banda * i, y:mT - 10, width:banda, height:H - mT - mB + 10, class:'hit'}, svg);
    hit.addEventListener('mousemove', ev => mostrarTip(ev, it.tip || it.etiqueta));
    hit.addEventListener('mouseleave', ocultarTip);
    if(o.onClick) hit.addEventListener('click', () => o.onClick(it, i));
  });
  refs.forEach(r => {
    const yy = y(r.valor);
    svgEl('line', {x1:mL, x2:W-mR, y1:yy, y2:yy, stroke:r.color, 'stroke-width':1.8, 'stroke-dasharray':'6 4', 'pointer-events':'none'}, svg);
    svgEl('text', {x:W-mR, y:yy-6, 'text-anchor':'end', class:'linea-num', style:`fill:${r.color}`, 'pointer-events':'none'}, svg).textContent = r.etiqueta;
  });
}

/* Barras horizontales: rows [{etiqueta, valor, segs?, meta?, color?, tip?}] */
function barrasH(cont, rows, o={}){
  cont.innerHTML = '';
  if(!rows.length){ cont.innerHTML = `<div class="vacio">${o.vacio || 'Sin datos'}</div>`; return; }
  const fila = 30, mL = o.mL || 150, mR = 46, W = Math.max(cont.clientWidth || 500, 360), H = rows.length*fila + 8;
  const max = Math.max(1, ...rows.map(r => Math.max(r.valor, r.meta||0))) * 1.05;
  const x = v => mL + (W - mL - mR) * v / max;
  const svg = svgEl('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label': o.aria || 'Barras horizontales'}, cont);
  rows.forEach((r, i) => {
    const y0 = 4 + i*fila, bh = 16, by = y0 + (fila-bh)/2 - 2;
    const lbl = svgEl('text', {x:mL-10, y:by+12, 'text-anchor':'end', style:'fill:var(--text)'}, svg);
    const maxCar = Math.floor(mL / 6.3);  // cabe según el margen reservado para la etiqueta
    lbl.textContent = r.etiqueta.length > maxCar ? r.etiqueta.slice(0, maxCar-1)+'…' : r.etiqueta;
    svgEl('rect', {x:mL, y:by, width:W-mL-mR, height:bh, rx:4, fill:'var(--grid)'}, svg);
    if(r.segs){
      let acc = 0;
      r.segs.forEach(s => { if(!s.v) return;
        svgEl('rect', {x:x(acc)+(acc?2:0), y:by, width:Math.max(1, x(acc+s.v)-x(acc)-(acc?2:0)), height:bh, rx:4, fill:s.color}, svg);
        acc += s.v; });
    } else if(r.valor){
      svgEl('rect', {x:mL, y:by, width:Math.max(2, x(r.valor)-mL), height:bh, rx:4, fill:r.color || 'var(--teal)'}, svg);
    }
    if(r.meta) svgEl('line', {x1:x(r.meta), x2:x(r.meta), y1:by-4, y2:by+bh+4, stroke:'var(--text)', 'stroke-width':2, 'stroke-linecap':'round'}, svg);
    svgEl('text', {x:W-mR+6, y:by+12, class:'v'}, svg).textContent = r.etiquetaValor ?? fmt(r.valor);
    const hit = svgEl('rect', {x:0, y:y0, width:W, height:fila, class:'hit'}, svg);
    hit.addEventListener('mousemove', ev => mostrarTip(ev, r.tip || `<b>${esc(r.etiqueta)}</b><div>${fmt(r.valor)}</div>`));
    hit.addEventListener('mouseleave', ocultarTip);
    if(o.onClick) hit.addEventListener('click', () => o.onClick(r, i));
  });
}

function minibarras(serie, meta){ // sparkline de barras para las tarjetas del resumen (meta solo en días laborales)
  const W = 240, H = 46, n = serie.length, bw = W/n - 3;
  const max = Math.max(meta||0, ...serie.map(s=>s.total)) || 1;
  let s = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  serie.forEach((d,i) => {
    const m = d.lab ? meta : 0, h = Math.max(1, d.total/max*(H-4)), e = estado(d.total, m);
    s += `<rect x="${i*(W/n)}" y="${H-h}" width="${bw}" height="${h}" rx="2" fill="${m? (e.cls==='ok'?'var(--teal)':e.cls==='near'?'#C9A35F':'#C98A85') : 'var(--pend)'}"/>`;
  });
  if(meta) s += `<line x1="0" x2="${W}" y1="${H-meta/max*(H-4)}" y2="${H-meta/max*(H-4)}" stroke="${COLOR_META}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  return s + '</svg>';
}

// ---- valores manuales sueltos (meta de días de fila, capacidad semanal): casilla editable en línea
function valorManual(id, defecto){ const r = leerManuales()[id]; return (r && r.v != null) ? r.v : defecto; }
function inputManual(id, defecto, placeholder='—'){
  const v = valorManual(id, defecto);
  return `<input class="mini-in num" data-mini="${id}" inputmode="numeric" value="${v==null?'':fmt(v)}" placeholder="${placeholder}" aria-label="${id}">`;
}
// Solo dígitos. Se reescribe la casilla únicamente si hay algo que limpiar: reescribirla siempre hace que
// Chrome/Edge no disparen "change", por eso además se guarda al salir de la casilla (focusout) o con Enter.
function soloDigitos(inp){ const limpio = inp.value.replace(/[^\d]/g,''); if(limpio !== inp.value) inp.value = limpio; }
// Los valores manuales viven en la base de datos (cesar.valor_manual): todos los que abren el tablero ven lo mismo.
// Se pinta de una vez (optimista) y se guarda en segundo plano; si el servidor lo rechaza se revierte.
function guardarManual(id, texto){ // devuelve true si el valor guardado cambió
  const todos = leerManuales(), v = parseInt(String(texto).replace(/[^\d]/g,''), 10), antes = todos[id] ? todos[id].v : null;
  const nuevo = isNaN(v) ? null : v;
  if(nuevo === antes) return false;
  const previo = todos[id];
  if(nuevo == null) delete todos[id]; else todos[id] = {v: nuevo, t: new Date().toISOString(), u: usuarioEdicion()};
  enviarManual(id, nuevo).catch(err => {
    if(previo) todos[id] = previo; else delete todos[id];
    alert('No se guardó el valor: ' + err.message);
    render();
  });
  return true;
}
function usuarioEdicion(){
  let u = leerPref('tablero-usuario', '');
  if(!u){ u = (prompt('¿Quién está escribiendo el valor? (queda en el historial de cambios)') || '').trim(); if(u) guardarPref('tablero-usuario', u); }
  return u || null;
}
async function enviarManual(id, valor, reintento=false){
  const headers = {'Content-Type':'application/json'};
  let clave = null; try { clave = sessionStorage.getItem('tablero-clave'); } catch(e){}
  if(clave) headers['X-Clave'] = clave;
  const r = await fetch('/api/manual/' + encodeURIComponent(id), {method:'PUT', headers, body: JSON.stringify({valor, usuario: leerPref('tablero-usuario', '') || null})});
  if(r.status === 403 && !reintento){
    const c = prompt('Clave de edición del tablero:'); if(!c) throw new Error('se necesita la clave de edición');
    try { sessionStorage.setItem('tablero-clave', c); } catch(e){}
    return enviarManual(id, valor, true);
  }
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || ('error ' + r.status));
  D.manuales = j.manuales || D.manuales;
}
document.addEventListener('focusin', ev => { if(ev.target.dataset && ev.target.dataset.mini){ ev.target.value = ev.target.value.replace(/\./g,''); ev.target.select(); } });
document.addEventListener('input', ev => { if(ev.target.dataset && ev.target.dataset.mini) soloDigitos(ev.target); });
document.addEventListener('keydown', ev => { if(ev.target.dataset && ev.target.dataset.mini && ev.key === 'Enter') ev.target.blur(); });
document.addEventListener('focusout', ev => {
  const id = ev.target.dataset && ev.target.dataset.mini; if(!id) return;
  if(guardarManual(id, ev.target.value)) render();  // recalcula estados y gráficas con el nuevo valor
  else { const v = valorManual(id, null); ev.target.value = v == null ? '' : fmt(v); }
});

// ---- Resumen: producción semanal (barras) + capacidad semanal (línea roja, manual) + piezas retenidas (línea)
const COLOR_RETENIDAS = 'var(--text)';
let zoomRes = null; // índice de la semana abierta en el Resumen (null = vista de semanas)
// La capacidad que se escribe es DIARIA (la misma cada día laboral de esa semana), no se divide.
// Orden: la propia de la semana (cap-AAAA-MM-DD) → la capacidad diaria base → la meta diaria.
// En la vista semanal la línea muestra la semana completa: capacidad diaria × días laborales.
// Cada día puede tener su propia capacidad (capd-AAAA-MM-DD), que manda sobre la de la semana.
// La capacidad de la semana es la suma de la capacidad de sus 7 días.
const claveCap = s => 'cap-' + s.desde;
const claveCapDia = iso => 'capd-' + iso;
function capDiaRespaldo(){ return metaDiaria(); }   // sin capacidad propia de la semana se usa la meta diaria
function isoDe(f){ return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`; }
function infoDia(iso){ // laboral = lunes a sábado sin festivo
  const f = fecha(iso), festivo = (D.festivos || []).includes(iso);
  return {iso, lab: f.getDay() !== 0 && !festivo, festivo, domingo: f.getDay() === 0};
}
// Día productivo = lunes a viernes sin festivo. Sábados, domingos y festivos solo se muestran en las gráficas por día
// si tienen datos (si se trabajó); así no aparecen barras en 0 de días que no son productivos.
const esDiaProductivo = iso => { const i = infoDia(iso); return i.lab && fecha(iso).getDay() !== 6; };
const diaVisible = (iso, valor) => esDiaProductivo(iso) || (valor || 0) > 0;
function lunesDe(iso){ const f = fecha(iso); f.setDate(f.getDate() - ((f.getDay() + 6) % 7)); return isoDe(f); }
function capDiaSemanaIso(lunes){ const p = valorManual('cap-' + lunes, null); return p != null ? p : capDiaRespaldo(); }
function capDiaSemana(s){ return capDiaSemanaIso(s.desde); }
function diasRango(desde, hasta){ const out = [], f = fecha(desde), fin = fecha(hasta); while(f <= fin){ out.push(infoDia(isoDe(f))); f.setDate(f.getDate() + 1); } return out; }
function diasDeSemana(s){ return diasRango(s.desde, s.hasta); }
function capDeDiaIso(iso){ // capacidad efectiva de un día: la propia del día → la de su semana (solo días laborales)
  const propia = valorManual(claveCapDia(iso), null);
  return propia != null ? propia : (infoDia(iso).lab ? capDiaSemanaIso(lunesDe(iso)) : 0);
}
function capDeDia(s, d){ return capDeDiaIso(d.iso); }
function capRango(desde, hasta){ return diasRango(desde, hasta).reduce((t, d) => t + capDeDiaIso(d.iso), 0); }
function capPromSemana(s){ // promedio de la capacidad efectiva de los días laborales (la propia del día o la de la semana)
  const lab = diasDeSemana(s).filter(d => d.lab || valorManual(claveCapDia(d.iso), null) != null);
  return lab.length ? lab.reduce((a, d) => a + capDeDiaIso(d.iso), 0) / lab.length : capDiaRespaldo();
}
function capSemana(s){ return capRango(s.desde, s.hasta); }
function retenidasRango(desde, hasta){ // última foto de piezas retenidas dentro del rango
  const hist = (D.aceros && D.aceros.historial) || {}, f = Object.keys(hist).filter(x => x >= desde && x <= hasta).sort().pop();
  return f ? hist[f].retenidas : null;
}
// casillas de capacidad alineadas bajo cada barra (celdas: [{clave, resp, titulo}])
function capFilaHTML(titulo, celdas){
  return `<span class="cap-tit">${titulo}</span><div class="cap-celdas" style="grid-template-columns:repeat(${celdas.length},minmax(0,1fr))">${
    celdas.map(c => `<span class="${valorManual(c.clave, null)!=null?'propia':''}" title="${esc(c.titulo)}: vacía = ${c.resp}">${inputManual(c.clave, null, c.resp)}</span>`).join('')}</div>`;
}
function dibujarResumen(){
  if(D && !$('#v-resumen').hidden) BLOQUES_RESUMEN.forEach(b => b.dibujar()); // secciones con gráfica por periodo (ej. Mantenimiento)
  const A = D && D.aceros, cont = $('#ch-res-prod'); if(!A || !cont || $('#v-resumen').hidden) return;
  const md = metaDiaria(), hist = A.historial || {};
  $('#res-volver').hidden = zoomRes === null;
  const leyendaLineas = `<span><i class="linea punteada" style="color:${COLOR_META}"></i>${zoomRes===null?'Capacidad semanal (suma de la capacidad de cada día)':'Capacidad del día'}</span>` +
    `<span><i class="linea" style="background:${COLOR_RETENIDAS}"></i>${retPisoPorDia() ? 'Piezas retenidas/refundidas en piso' : 'Piezas retenidas'}</span>`;

  if(zoomRes !== null){ // ---- zoom: los 7 días de la semana elegida
    const s = A.semanal[zoomRes];
    $('#res-cap').innerHTML = '';
    $('#res-sub').textContent = '';
    // siempre los 7 días: los que aún no pasan van vacíos (con su capacidad y la foto de piezas retenidas si existe)
    const dias = diasDeSemana(s).map(x => {
      const real = A.diaria.find(d => d.fecha === x.iso);
      const base = real || {fecha: x.iso, segs: {}, total: 0, eq: 0, futuro: true,
        nota: x.festivo ? 'Festivo' : x.domingo ? 'Domingo' : (x.iso === D.hoy ? 'Hoy' : 'Pendiente')};
      return {...base, lab: x.lab, info: x};
    }).filter(d => diaVisible(d.fecha, d.total));
    // casillas de capacidad por día, alineadas bajo cada día (vacía = la de la semana; domingos/festivos = 0 salvo que se escriba)
    $('#res-cap-fila').innerHTML = `<span class="cap-tit">Cap. día</span>
      <div class="cap-celdas" style="grid-template-columns:repeat(7,minmax(0,1fr))">${dias.map(d => {
        const propia = valorManual(claveCapDia(d.fecha), null) != null, resp = d.lab ? fmt(capDiaSemana(s)) : '0';
        return `<span class="${propia?'propia':''}" title="${fLarga(d.fecha)}: vacía = ${resp}">${inputManual(claveCapDia(d.fecha), null, resp)}</span>`; }).join('')}</div>`;
    const filas = dias.map(d => {
      const c = capDeDia(s, d.info), cap = c ? c : null, ret = retPisoDia(d.fecha), e = estado(d.total, cap || 0);
      return {cap, ret, item:{etiqueta: d.hoy ? 'Hoy' : fCorta(d.fecha), segs:d.segs, total:d.total, etiquetaValor: d.futuro ? '' : undefined,
        sub: d.hoy ? 'en curso' : cap && !d.futuro ? `${fmt(e.pct*100)} %` : (d.nota || ''), subColor: cap && !d.futuro && !d.hoy ? COLOR_EST[e.cls] : 'var(--muted)',
        tip: tipSegs(fLarga(d.fecha), d.segs,
          `<div class="r" style="margin-top:6px;border-top:1px solid #ffffff33;padding-top:4px"><span>Fabricados</span><span>${fmt(d.total)}</span></div>` +
          `<div class="r"><span style="color:#F2A69C">Capacidad</span><span>${cap?fmt(cap):'—'}</span></div>` +
          `<div class="r"><span style="color:#D6DEE6">Piezas retenidas</span><span>${ret==null?'sin dato':fmt(ret)}</span></div>`)}};
    });
    $('#res-titulo').textContent = `Producción ${s.etiqueta} vs. capacidad`;
    $('#res-leyenda').innerHTML = leyendaMat(matsPresentes(filas.map(x=>x.item)), leyendaLineas);
    barrasApiladas(cont, filas.map(x => x.item), {sub:true, alto:280, aria:`Producción por día de la ${s.etiqueta}`,
      lineas:[{vals:filas.map(x=>x.cap), color:COLOR_META, etiquetas:'ultima', punteada:true},
              {vals:filas.map(x=>x.ret), color:COLOR_RETENIDAS, etiquetas:'todas'}]});
    return;
  }
  $('#res-titulo').textContent = 'Producción semanal de aceros vs. capacidad';
  $('#res-sub').textContent = '';
  $('#res-cap').innerHTML = '';
  const sem = A.semanal.map(s => {
    const cap = capSemana(s);
    const ret = retPisoRango(s.desde, s.hasta);   // piezas retenidas/refundidas en piso registradas en la semana
    const capHastaAyer = diasDeSemana(s).filter(d => d.iso < D.hoy).reduce((t, d) => t + capDeDia(s, d), 0);
    const e = estado(s.total - (s.en_curso ? (s.hoy_total || 0) : 0), s.en_curso ? capHastaAyer : cap);   // % con días completos
    const ajustados = diasDeSemana(s).filter(d => valorManual(claveCapDia(d.iso), null) != null).length;
    return {s, cap, ret, item:{etiqueta:s.etiqueta.replace('Sem ','S'), segs:s.segs, total:s.total,
      sub: s.en_curso ? 'en curso' : `${fmt(e.pct*100)} %`, subColor: s.en_curso ? 'var(--muted)' : COLOR_EST[e.cls],
      tip: tipSegs(`${s.etiqueta} (${fCorta(s.desde)} – ${fCorta(s.hasta)})${s.en_curso?' · en curso':''}`, s.segs,
        `<div class="r" style="margin-top:6px;border-top:1px solid #ffffff33;padding-top:4px"><span>Fabricados</span><span>${fmt(s.total)}</span></div>` +
        `<div class="r"><span style="color:#F2A69C">Capacidad semana</span><span>${fmt(cap)}</span></div>` +
        `<div style="opacity:.75">${fmt(capDiaSemana(s))}/día × ${s.dias_lab_total} días laborales${ajustados?` · ${ajustados} día(s) con capacidad propia`:''}</div>` +
        `<div class="r"><span style="color:#D6DEE6">Piezas retenidas</span><span>${ret==null?'sin dato':fmt(ret)}</span></div>`)}};

  $('#res-leyenda').innerHTML = leyendaMat(matsPresentes(sem.map(x=>x.item)), leyendaLineas);

function kpi(lbl, val, unidad, desc, extra='', cls=''){
  return `<div class="kpi ${cls}"><div class="lbl"><span>${lbl}</span>${extra}</div>
    <div class="val">${val}${unidad?` <small>${unidad}</small>`:''}</div>${desc?`<div class="desc">${desc}</div>`:''}</div>`;
}
// ---- tarjetas manuales: el número se escribe en la tarjeta y se guarda en este navegador con su fecha/hora
function leerManuales(){ return (D && D.manuales) || {}; }
function kpiManual(id, lbl, unidad, lado='', cls=''){
  const num = `<div class="val"><input class="val-input num" data-manual="${id}" inputmode="numeric" placeholder="—" aria-label="${lbl}"> <small>${unidad}</small><span class="lapiz" title="Se escribe a mano">✎</span></div>
    <div class="desc"><span class="registro" data-registro="${id}">Clic en el número para escribirlo</span></div>`;
  return `<div class="kpi manual ${cls}"><div class="lbl"><span>${lbl}</span></div>
    ${lado ? `<div class="lado"><div>${num}</div><div>${lado}</div></div>` : num}</div>`;
}
function textoRegistro(r){
  if(!r || r.v==null) return 'Clic en el número para escribirlo';
  const f = new Date(r.t), hoy = new Date().toDateString() === f.toDateString();
  return `${hoy ? 'Registrado hoy' : '⚠ Registrado el ' + f.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})} · ${f.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`;
}
function activarManuales(){
  const datos = leerManuales();
  // grupos (ej. X5 por pieza): total = suma de sus casillas; el registro muestra la última modificación del grupo
  const pintarGrupo = g => {
    const todos = leerManuales(), ids = [...document.querySelectorAll(`[data-grupo="${g}"]`)].map(i => i.dataset.manual);
    const regs = ids.map(id => todos[id]).filter(r => r && r.v != null);
    const tot = document.querySelector(`[data-total="${g}"]`), reg = document.querySelector(`[data-registro="grupo-${g}"]`);
    if(tot) tot.textContent = regs.length ? fmt(regs.reduce((s,r)=>s+r.v,0)) : '—';
    if(reg){ const ult = regs.sort((a,b)=>b.t.localeCompare(a.t))[0];
      reg.textContent = ult ? textoRegistro(ult) : 'Clic en cada número para escribirlo';
      reg.classList.toggle('viejo', !!ult && new Date(ult.t).toDateString() !== new Date().toDateString()); }
  };
  document.querySelectorAll('[data-manual]').forEach(inp => {
    const id = inp.dataset.manual, grupo = inp.dataset.grupo, reg = document.querySelector(`[data-registro="${id}"]`);
    const pintar = () => {
      if(grupo) return pintarGrupo(grupo);
      const r = leerManuales()[id]; reg.textContent = textoRegistro(r); reg.classList.toggle('viejo', !!r && new Date(r.t).toDateString() !== new Date().toDateString()); };
    if(datos[id] && datos[id].v != null) inp.value = fmt(datos[id].v);
    pintar();
    inp.addEventListener('focus', () => { inp.value = inp.value.replace(/\./g,''); inp.select(); });
    inp.addEventListener('input', () => soloDigitos(inp));
    const guardar = () => {  // al salir de la casilla (no depende de "change", ver soloDigitos)
      guardarManual(id, inp.value);
      const v = valorManual(id, null);
      inp.value = v == null ? '' : fmt(v);
      pintar();
    };
    inp.addEventListener('blur', guardar);
    inp.addEventListener('keydown', ev => { if(ev.key === 'Enter') inp.blur(); });
  });
}
