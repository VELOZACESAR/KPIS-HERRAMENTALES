// Barra de lo fabricado (por material, con el número en cada tramo) contra la marca de lo proyectado
const COLOR_TARDE = '#C9A04A'; // entregado después de la fecha comprometida (ocre suave)
function barraProyeccion(segs, real, proy, txt={marca:'Proyectado', falta:'Faltó para lo proyectado', faltaCorto:'faltan'}){
  const tarde = txt.tarde || 0;
  // la escala llega justo al mayor valor: si se sobre-ejecuta la barra llena todo el ancho;
  // si falta, el faltante (rayado) completa hasta lo proyectado. Nunca queda espacio vacío.
  const max = Math.max(real, proy, 1), mats = D.orden_materiales.filter(m => segs[m]);
  const tramos = mats.map(m => {
    const w = segs[m]/max*100;
    return `<i style="width:${w}%;background:${COLOR_MAT[m]};color:${tintaSobre(COLOR_MAT[m])}" title="${m}: ${segs[m]}">${w>5?fmt(segs[m]):''}</i>`; }).join('');
  const faltan = Math.max(0, proy - real - tarde);
  return `<div><div class="proy">
    ${proy ? `<div class="proy-marca" style="left:${proy/max*100}%"><span>${txt.marca} <b class="num">${fmt(proy)}</b></span></div>` : ''}
    <div class="proy-bar">${tramos}${tarde ? `<i style="width:${tarde/max*100}%;background:${COLOR_TARDE};color:#fff" title="Entregados tarde: ${tarde}">${tarde/max*100>5?fmt(tarde):''}</i>` : ''}${faltan ? `<i class="proy-falta" style="width:${faltan/max*100}%" title="${txt.falta}: ${faltan}">${faltan/max*100>5?txt.faltaCorto+' '+fmt(faltan):''}</i>` : ''}</div></div>
    <div class="proy-ley">${mats.map(m=>`<span><i style="background:${COLOR_MAT[m]}"></i>${m} <b class="num">${fmt(segs[m])}</b></span>`).join('')}
      ${tarde ? `<span><i style="background:${COLOR_TARDE}"></i>Entregados tarde <b class="num">${fmt(tarde)}</b></span>` : ''}
      ${faltan ? `<span><i class="proy-falta"></i>${txt.falta} <b class="num">${fmt(faltan)}</b></span>` : proy && real>proy ? `<span>Sobre lo proyectado <b class="num" style="color:var(--ok)">+${fmt(real-proy)}</b></span>` : ''}</div>
  </div>`;
}

// Matriceros: lo hecho va sobre la barra, la meta ("de 20") al lado, y el estado al final
function tarjetaMatriceros(lista, meta){
  if(!lista.length) return '<div class="desc" style="padding:12px 0">Nadie registró aceros entregados ese día.</div>';
  const conNombre = lista.filter(m => m.nombre !== 'Sin matricero registrado');
  const total = lista.reduce((s,m)=>s+m.n,0), metaTotal = meta * conNombre.length;
  const max = Math.max(meta, ...lista.map(m => m.n)), eT = estado(total, metaTotal);
  return `<div class="matr">${lista.map(m => {
    const sinNombre = m.nombre === 'Sin matricero registrado', e = estado(m.n, meta), w = m.n/max*100;
    const detalle = D.orden_materiales.filter(k=>m.segs[k]).map(k=>`${k}: ${m.segs[k]}`).join(' · ');
    return `<div class="matr-fila" title="${esc(m.nombre)} — ${detalle} · ${fmt(m.eq,1)} equivalentes">
      <span class="matr-nom${sinNombre?' sin':''}">${esc(m.nombre)}</span>
      <span class="matr-bar"><i style="width:${w}%;background:${sinNombre?'var(--muted)':'var(--teal)'}"><em class="num">${fmt(m.n)}</em></i>${sinNombre?'':`<b style="left:${meta/max*100}%"></b>`}</span>
      <span class="matr-meta">${sinNombre?'':`de <b class="num">${fmt(meta)}</b>`}</span>
      <span class="matr-e" style="color:${sinNombre?'var(--muted)':COLOR_EST[e.cls]}">${sinNombre?'':`${e.ico} ${fmt(e.pct*100)} %`}</span>
    </div>`; }).join('')}
    <div class="matr-fila matr-tot"><span class="matr-nom">Total del día</span>
      <span class="num" style="font-size:15px">${fmt(total)}</span>
      <span class="matr-meta">de <b class="num">${fmt(metaTotal)}</b></span>
      <span class="matr-e" style="color:${COLOR_EST[eT.cls]}">${eT.ico} ${eT.pct!=null?fmt(eT.pct*100)+' %':''}</span></div></div>`;
}

function vistaAceros(A){
  if(!A) return `<section class="vista" id="v-aceros" hidden><div class="aviso err">No se pudo leer el consolidado de aceros.</div></section>`;
  const a = A.ayer, k = A.kpis;
  const eProd = estado(a.comprometidos_hechos, a.comprometidos);
  const eRech = estado(a.rechazos, a.rechazos_prom, true);
  const noCump = a.no_cumplidos || [];
  const pendientes = noCump.filter(x => !x.fab), porPuesto = {};
  pendientes.forEach(x => { const k = (x.puesto || 'Sin puesto').trim(); porPuesto[k] = (porPuesto[k] || 0) + 1; });
  const codPuesto = k => { const m = /^(\d{2})/.exec(k); return m ? +m[1] : -1; };   // 07 Recorte = más crítico
  const nomPuesto = k => { const c = (A.cuellos || []).find(c => c.codigo === k); return c ? `${k.slice(0, 2)} ${c.puesto}` : k; };
  const puestos = Object.entries(porPuesto).sort((a, b) => codPuesto(b[0]) - codPuesto(a[0]) || b[1] - a[1]);
  const maxPu = Math.max(1, ...puestos.map(x => x[1]));
  const resumenPuestos = puestos.length ? `<div class="puestos">${puestos.map(([k, n]) => {
      const c = codPuesto(k), color = c > 0 ? CALOR[Math.min(CALOR.length - 1, c - 1)] : 'var(--muted)';
      return `<div class="pu-fila"><span class="pu-nom">${esc(nomPuesto(k))}</span><span class="pu-bar"><i style="width:${n / maxPu * 100}%;background:${color}"></i></span><span class="pu-n">${fmt(n)}</span></div>`; }).join('')}</div>` : '';
  const tablaNoCump = noCump.length ? `<details class="no-cump"><summary>Ver los ${fmt(pendientes.length)} sin fabricar por puesto${noCump.length > pendientes.length ? ` · ${fmt(noCump.length - pendientes.length)} entregados tarde` : ''}</summary>
    ${resumenPuestos}
    <div class="tabla"><table><thead><tr><th>Orden</th><th>Acero</th><th>Puesto</th><th>Estado</th></tr></thead><tbody>${
      noCump.map(x => `<tr title="${esc(x.vehiculo)} · ${esc(x.mat)}"><td class="num">${esc(x.orden)}</td><td class="num">${esc(x.acero)}</td><td>${esc(x.puesto)}</td><td style="white-space:nowrap">${
        x.fab ? `Tarde (${fCorta(x.fab)})` : '<b style="color:var(--bad)">Sin fabricar</b>'}</td></tr>`).join('')}</tbody></table></div></details>` : '';

  return `<section class="vista" id="v-aceros" hidden>
  <div class="seg sub-aceros" id="aceros-sub" role="tablist">
    <button data-sub="retrofit" aria-pressed="${subAceros==='retrofit'}">Aceros retrofit</button>
    <button data-sub="oem" aria-pressed="${subAceros==='oem'}">Aceros OEM · BMW X5</button>
  </div>
  <div id="aceros-retrofit" ${subAceros==='retrofit'?'':'hidden'}>
  <h2 class="sec">Resultados del ${fLarga(a.fecha)}</h2>
  <div class="grid-ayer">
    <div class="kpi hero span2">
      <div class="lbl"><span>Cumplimiento de compromisos · ${fCorta(a.fecha)}</span>${chip(eProd)}</div>
      <div class="val">${fmt(a.comprometidos_hechos)} <small>cumplidos de</small> ${fmt(a.comprometidos)} <small>comprometidos${a.comprometidos_tarde ? ` · ${fmt(a.comprometidos_tarde)} entregados tarde` : ''}</small></div>
      ${barraProyeccion(conTarde({segs: a.comprometidos_segs, segs_tarde: a.comprometidos_segs_tarde}), a.comprometidos_hechos + (a.comprometidos_tarde || 0), a.comprometidos, {marca:'Comprometidos', falta:'Sin fabricar', faltaCorto:'faltan'})}
      ${tablaNoCump}
    </div>
    ${kpi(`Rechazos · ${fCorta(a.fecha)}`, fmt(a.rechazos), 'órdenes', `Promedio diario últimos 30 días: <b>${fmt(a.rechazos_prom,1)}</b>`, chip(eRech), 'hero')}
    <div class="kpi hero span2">
      <div class="lbl"><span>Producción por matricero · ${fCorta(a.fecha)}</span><span class="chip neutral">Meta ${A.meta_turno} por turno</span></div>
      ${tarjetaMatriceros(a.matriceros, A.meta_turno)}
    </div>
  </div>

  <h2 class="sec">Estado actual de la producción</h2>
  <div class="grid-estado1">
    <div class="kpi"><div class="lbl"><span>Fila en fabricación</span></div>
      <div class="multi">
        <div><div class="val">${fmt(k.fila)}</div><div class="desc">aceros en fila</div></div>
        <div><div class="val">${fmt(k.dias_fila)}</div><div class="desc">días de fila<br>(incluye hoy)</div></div>
        <div><div class="val" style="color:${k.vencidos?'var(--bad)':'var(--ok)'}">${fmt(k.vencidos)}</div><div class="desc">${k.vencidos?'▼ ':''}con fecha vencida</div></div>
      </div></div>
    ${kpi('Productividad promedio', fmt(k.productividad,1), 'aceros/día', `Últimos ${k.dias_prom} días con producción`)}
    ${kpi('Fabricación por rechazo', fmt(k.pct_rechazo_30,1)+' %', '', `${fmt(k.rechazos_30)} rechazos en 30 días`)}
    ${tarjetaCortes()}
    ${kpiManual('en-fabricacion', 'Aceros en fabricación', 'aceros')}
  </div>

  <div class="panel" style="margin-top:16px">
    <div class="panel-head"><div><h3 id="prod-titulo">Producción de aceros vs. capacidad</h3><p id="prod-sub"></p></div>
      <div class="prod-ctrl">
        <button class="btn-volver" id="prod-volver" hidden>← Volver</button>
        <div class="seg" id="prod-vista"><button aria-pressed="true" data-v="diaria">Diario</button><button aria-pressed="false" data-v="semanal">Semanal</button><button aria-pressed="false" data-v="mensual">Mensual</button></div>
      </div></div>
    <div id="prod-leyenda"></div><div class="chart" id="ch-prod"></div>
    <div class="cap-fila" id="prod-cap-fila"></div>
  </div>

  <div class="grid-2">
    <div class="panel"><div class="panel-head"><div><h3 id="comp-titulo">Cumplimiento de fechas de compromiso</h3><p id="comp-sub"></p></div>
      <div class="prod-ctrl">
        <button class="btn-volver" id="comp-volver" hidden>← Volver</button>
        <div class="seg" id="comp-vista"><button aria-pressed="true" data-v="diaria">Diario</button><button aria-pressed="false" data-v="semanal">Semanal</button><button aria-pressed="false" data-v="mensual">Mensual</button></div>
      </div></div>
      <div id="comp-leyenda"></div><div class="chart" id="ch-comp"></div><div class="tabla" id="comp-detalle"></div></div>
    <div class="panel"><div class="panel-head"><div><h3>Piezas retenidas / refundidas en piso</h3><p id="ret-sub"></p></div></div>
      <div id="ret-cuerpo"></div></div>
  </div>

  <div class="grid-2">
    <div class="panel"><div class="panel-head"><div><h3 id="rech-titulo">Rechazos de aceros por semana</h3><p id="rech-desc"></p></div>
      <button class="btn-volver" id="rech-volver" hidden>← Semanas</button></div>
      <div class="chart" id="ch-rech"></div><div class="tabla" id="tb-rech"></div></div>
    <div class="panel"><div class="panel-head"><div><h3>Piezas retenidas por falta de acero · por puesto</h3></div></div>
      <div id="ch-cuellos"></div><div class="tabla" id="tb-cuellos"></div></div>
  </div>
  </div>
  ${vistaAcerosOem()}
  </section>`;
}

function tarjetaResumenOem(){
  const X = D.x5;
  if(!X) return '';
  const tm = X.filas.reduce((s,f)=>s+f.matriceria,0), tc = X.filas.reduce((s,f)=>s+f.calidad,0);
  const mayor = [...X.filas].sort((a,b) => (b.matriceria+b.calidad)-(a.matriceria+a.calidad))[0];
  return `<article class="serv-largo" data-ir="aceros" data-sub-ir="oem" tabindex="0">
    <div class="sl-head"><h3>Aceros OEM · BMW X5</h3><span class="ver">${t('ver_detalle')}</span></div>
    <div class="sl-grid">
      <div class="sl-bloque"><div class="lbl"><span>Inventario total</span></div><div class="val">${fmt(tm+tc)} <small>aceros</small></div>
        <div class="desc">${X.filas.map(f => `${esc(f.pieza)} <b>${fmt(f.matriceria+f.calidad)}</b>`).join(' · ')}</div></div>
      <div class="sl-bloque"><div class="lbl"><span>En matricería</span></div><div class="val">${fmt(tm)}</div></div>
      <div class="sl-bloque"><div class="lbl"><span>En calidad (piso)</span></div><div class="val">${fmt(tc)}</div></div>
      <div class="sl-bloque"><div class="lbl"><span>Pieza con más inventario</span></div><div class="val" style="font-size:16px;line-height:1.3">${mayor ? esc(mayor.pieza) : '—'}</div></div>
    </div></article>`;
}
function cambiarSubAceros(sub, redibujar=true){
  subAceros = sub;
  document.querySelectorAll('#aceros-sub button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sub === sub));
  const r = $('#aceros-retrofit'), o = $('#aceros-oem');
  if(r) r.hidden = sub !== 'retrofit';
  if(o) o.hidden = sub !== 'oem';
  if(redibujar) dibujarAceros();
}
function dibujarOem(){
  const X = D && D.x5; if(!X || !$('#ch-x5-hist') || $('#aceros-oem').hidden) return;
  const op = {orden:['Matricería','Calidad (piso)'], colores:COLOR_X5};

  dibujarRechazos();

// ---- Producción vs. capacidad (mismo formato que el Resumen): barras por material, línea punteada de capacidad,
//      línea de piezas retenidas y casillas de capacidad debajo (por día en diario/zoom, por semana en semanal).
//      En semanal o mensual, clic en una barra = zoom a los días de esa semana o mes.
function filasTip(total, cap, eq, ret, nota=''){
  return `<div class="r" style="margin-top:6px;border-top:1px solid #ffffff33;padding-top:4px"><span>Fabricados</span><span>${fmt(total)}</span></div>` +
    `<div class="r"><span style="color:#F2A69C">Capacidad</span><span>${cap?fmt(cap):'—'}</span></div>${nota?`<div style="opacity:.75">${nota}</div>`:''}` +
    `<div class="r"><span style="color:#D6DEE6">Piezas retenidas</span><span>${ret==null?'sin dato':fmt(ret)}</span></div>` +
    `<div class="r"><span>Equivalentes</span><span>${fmt(eq,1)}</span></div>`;
}
function filaDia(iso){ // datos reales del día o un día vacío si aún no llega
  const real = D.aceros.diaria.find(d => d.fecha === iso), i = infoDia(iso);
  return real || {fecha: iso, segs: {}, total: 0, eq: 0, futuro: true,
    nota: i.festivo ? 'Festivo' : i.domingo ? 'Domingo' : (iso === D.hoy ? 'Hoy' : 'Pendiente')};
}
// Piezas retenidas / refundidas en piso registradas cada día (tabla cesar.aceros_retenidas_piso). Si la tabla aún
// no existe en el servidor, la línea sigue saliendo de la foto diaria de piezas retenidas como antes.
function retPisoPorDia(){
  const R = D.aceros && D.aceros.retenidas_piso; if(!R) return null;
  const m = {}; R.filas.forEach(f => m[f.fecha] = (m[f.fecha] || 0) + 1); return m;
}
function retPisoDia(iso){ // piezas registradas ese día (o la foto diaria anterior si la tabla aún no existe)
  const m = retPisoPorDia(); if(!m){ const h = (D.aceros && D.aceros.historial) || {}; return h[iso] ? h[iso].retenidas : null; }
  return iso > D.hoy ? null : (m[iso] || 0);
}
function retPisoRango(desde, hasta){
  const m = retPisoPorDia(); if(!m) return retenidasRango(desde, hasta);
  if(desde > D.hoy) return null;
  let n = 0; for(const f in m) if(f >= desde && f <= hasta) n += m[f]; return n;
}
function dibujarProduccion(){
  const A = D.aceros, hist = A.historial || {}, enZoom = zoomProd !== null && vistaProd !== 'diaria';
  const retDia = retPisoDia;
  $('#prod-volver').hidden = !enZoom;
  const barraDia = d => {
    const cap = capDeDiaIso(d.fecha) || null, ret = retDia(d.fecha), e = estado(d.total, cap || 0);
    return {cap, ret, item:{etiqueta: d.hoy ? 'Hoy' : fCorta(d.fecha), segs:d.segs, total:d.total, etiquetaValor: d.futuro ? '' : undefined,
      sub: d.hoy ? 'en curso' : cap && !d.futuro ? `${fmt(e.pct*100)} %` : (d.nota || ''), subColor: cap && !d.futuro && !d.hoy ? COLOR_EST[e.cls] : 'var(--muted)',
      tip: tipSegs(fLarga(d.fecha), d.segs, filasTip(d.total, cap, d.eq, ret))}};
  };
  const celdaDia = d => { const i = infoDia(d.fecha);
    return {clave: claveCapDia(d.fecha), resp: i.lab ? fmt(capDiaSemanaIso(lunesDe(d.fecha))) : '0', titulo: fLarga(d.fecha)}; };

  let filas, celdas = null, tituloCeldas = 'Cap. día', titulo = 'Producción de aceros vs. capacidad', sub = '', onClick = null, porDia = true;
  if(vistaProd === 'diaria'){
    const dias = A.diaria.filter(d => diaVisible(d.fecha, d.total)).slice(-14);
    filas = dias.map(barraDia); celdas = dias.map(celdaDia);
  } else if(enZoom){
    const p = A[vistaProd][zoomProd];
    const dias = (vistaProd === 'semanal' ? diasRango(p.desde, p.hasta).map(x => filaDia(x.iso))   // semana: sus días
                                          : A.diaria.filter(d => d.fecha >= p.desde && d.fecha <= p.hasta)).filter(d => diaVisible(d.fecha, d.total));
    filas = dias.map(barraDia); celdas = dias.map(celdaDia);
    titulo = `Producción ${vistaProd === 'mensual' ? MESES[+p.etiqueta-1] : p.etiqueta} vs. capacidad`;
  } else {
    porDia = false;
    filas = A[vistaProd].map(s => {
      const cap = capRango(s.desde, s.hasta), ret = retPisoRango(s.desde, s.hasta);
      const capHastaAyer = capRango(s.desde, s.hasta < D.hoy ? s.hasta : isoDe(new Date(fecha(D.hoy).getTime() - 864e5)));
      const e = estado(s.total - (s.en_curso ? (s.hoy_total || 0) : 0), s.en_curso ? capHastaAyer : cap);   // % con días completos
      const mensual = vistaProd === 'mensual';
      const nombre = mensual ? MESES[+s.etiqueta-1] : `${s.etiqueta} (${fCorta(s.desde)} – ${fCorta(s.hasta)})`;
      return {cap, ret, item:{etiqueta: mensual ? MESES[+s.etiqueta-1].slice(0,3) : s.etiqueta.replace('Sem ','S'), segs:s.segs, total:s.total,
        sub: s.en_curso ? 'en curso' : `${fmt(e.pct*100)} %`, subColor: s.en_curso ? 'var(--muted)' : COLOR_EST[e.cls],
        tip: tipSegs(nombre + (s.en_curso?' · en curso':''), s.segs, filasTip(s.total, cap, s.eq, ret, 'suma de la capacidad de cada día') +
          '<div style="margin-top:4px;opacity:.75">Clic para ver los días</div>')}};
    });
    if(vistaProd === 'semanal'){ tituloCeldas = 'Cap./día';

  $('#prod-cap-fila').innerHTML = celdas ? capFilaHTML(tituloCeldas, celdas) : '';
}

async function llamarRetenidas(metodo, ruta, cuerpo){
  const headers = {'Content-Type':'application/json'};
  let clave = null; try { clave = sessionStorage.getItem('tablero-clave'); } catch(e){}
  if(clave) headers['X-Clave'] = clave;
  const r = await fetch(ruta, {method: metodo, headers, body: cuerpo ? JSON.stringify({...cuerpo, usuario: leerPref('tablero-usuario', '') || null}) : undefined});
  if(r.status === 403){ const c = prompt('Clave de edición del tablero:'); if(c){ try { sessionStorage.setItem('tablero-clave', c); } catch(e){} return llamarRetenidas(metodo, ruta, cuerpo); } }
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || ('error ' + r.status));
  return j;
}

// ---- Cumplimiento de compromisos (por fecha de entrega a producción): 10 barras por vista.
//      Diario = últimos días + próximos días con aceros asignados ("prog."); Semanal/Mensual = 10 periodos,
//      clic en una barra = zoom a sus días. Fabricados (color) sobre comprometidos (gris).
let vistaComp = 'diaria', zoomComp = null;
const BARRAS_COMP = 10;
function semanaIso(iso){
  const f = fecha(iso); f.setDate(f.getDate() + 3 - ((f.getDay() + 6) % 7));
  const e = new Date(f.getFullYear(), 0, 4);
  return 1 + Math.round(((f - e) / 864e5 - 3 + ((e.getDay() + 6) % 7)) / 7);
}
// Lo entregado después de la fecha comprometida también cierra la barra, con el color de su material.
const conTarde = c => { const s = {...c.segs}; for(const m in (c.segs_tarde || {})) s[m] = (s[m] || 0) + c.segs_tarde[m]; return s; };
const sumarObj = (dias, campo) => { const o = {}; dias.forEach(d => Object.entries(d[campo] || {}).forEach(([k, v]) => o[k] = (o[k] || 0) + v)); return o; };
// Detalle del zoom: por cada fecha comprometida, cuántos se entregaron a tiempo, tarde y pendientes, y en qué fechas
// se entregaron (las fechas posteriores al compromiso van marcadas como tarde).
function tablaEntregasComp(dias){
  const chip = (iso, n, tarde) => `<span class="ent ${tarde ? 'tarde' : ''}" title="${fLarga(iso)}${tarde ? ' · después del compromiso' : ''}">${fCorta(iso)} <b>${fmt(n)}</b></span>`;
  return `<table><thead><tr><th>Compromiso</th><th class="n">Comprometidos</th><th class="n">A tiempo</th><th class="n">Tarde</th><th class="n">Pendientes</th><th>Fechas de entrega</th></tr></thead><tbody>${
    dias.map(d => { const pend = d.comprometidos - d.hechos - (d.tarde || 0);
      const ent = Object.entries(d.entregas || {}).sort((a, b) => a[0] < b[0] ? -1 : 1);
      return `<tr><td style="white-space:nowrap;font-weight:600">${fLarga(d.fecha)}</td><td class="n">${fmt(d.comprometidos)}</td>
        <td class="n" style="color:var(--ok);font-weight:700">${fmt(d.hechos)}</td>
        <td class="n" style="color:${d.tarde ? 'var(--bad)' : 'var(--muted)'};font-weight:700">${fmt(d.tarde || 0)}</td>
        <td class="n" style="color:${pend > 0 ? 'var(--text)' : 'var(--muted)'}">${fmt(pend)}</td>
        <td><div class="ents">${ent.map(([iso, n]) => chip(iso, n, iso > d.fecha)).join('') || '—'}</div></td></tr>`; }).join('')}</tbody></table>`;
}
function sumarComp(dias){
  const segs = {};
  dias.forEach(d => Object.entries(d.segs).forEach(([m, v]) => segs[m] = (segs[m] || 0) + v));
  return {segs, comprometidos: dias.reduce((s, d) => s + d.comprometidos, 0), hechos: dias.reduce((s, d) => s + d.hechos, 0),
          tarde: dias.reduce((s, d) => s + (d.tarde || 0), 0), segs_tarde: sumarObj(dias, 'segs_tarde'), entregas: sumarObj(dias, 'entregas')};
}
function periodosComp(vista){
  const dias = D.aceros.cumplimiento, grupos = {};
  dias.forEach(d => {
    const k = vista === 'semanal' ? lunesDe(d.fecha) : d.fecha.slice(0, 7);
    (grupos[k] = grupos[k] || []).push(d);
  });
  const ayer = isoDe(new Date(fecha(D.hoy).getTime() - 864e5));
  return Object.keys(grupos).sort().slice(-BARRAS_COMP).map(k => {
    let desde, hasta;
    if(vista === 'semanal'){ desde = k; const f = fecha(k); f.setDate(f.getDate() + 6); hasta = isoDe(f); }
    else { desde = k + '-01'; const f = fecha(desde); f.setMonth(f.getMonth() + 1, 0); hasta = isoDe(f); }
    const pasados = grupos[k].filter(d => !d.futuro);
    return {clave:k, desde, hasta, dias:grupos[k], ...sumarComp(grupos[k]), hastaAyer: sumarComp(pasados),
      estado: hasta <= ayer ? 'pasado' : desde >= D.hoy ? 'prog' : 'curso'};
  });
}
function filasComp(c, futuro){
  return `<div class="r" style="margin-top:6px"><span>Comprometidos</span><span>${fmt(c.comprometidos)}</span></div>` +
    `<div class="r"><span>${futuro ? 'Ya fabricados (adelantados)' : 'Entregados a tiempo'}</span><span>${fmt(c.hechos)}</span></div>` +
    (c.tarde ? `<div class="r"><span>Entregados tarde</span><span>${fmt(c.tarde)}</span></div>` : '') +
    `<div class="r"><span>Pendientes</span><span>${fmt(c.comprometidos - c.hechos - (c.tarde || 0))}</span></div>`;
}
function barraCompDia(c){
  const e = estado(c.hechos, c.comprometidos), i = infoDia(c.fecha);
  const sub = c.futuro ? (c.comprometidos ? 'prog.' : '') : c.comprometidos ? `${fmt(e.pct*100)} %` : (i.festivo ? 'Festivo' : i.domingo ? 'Domingo' : '');
  return {etiqueta: c.fecha === D.hoy ? 'Hoy' : fCorta(c.fecha), segs:conTarde(c), total:c.hechos + (c.tarde || 0), fondo:c.comprometidos,
    etiquetaValor: c.comprometidos ? `${fmt(c.hechos + (c.tarde || 0))}/${fmt(c.comprometidos)}` : '',
    sub, subColor: c.futuro || !c.comprometidos ? 'var(--muted)' : COLOR_EST[e.cls],
    tip: tipSegs(fLarga(c.fecha) + (c.futuro ? ' · programado' : ''), c.segs, filasComp(c, c.futuro))};
}
function dibujarCumplimiento(){
  const A = D.aceros, enZoom = zoomComp !== null && vistaComp !== 'diaria';
  $('#comp-volver').hidden = !enZoom;
  document.querySelectorAll('#comp-vista button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === vistaComp));
  let items, titulo = 'Cumplimiento de fechas de compromiso', sub, onClick = null, detalleDias = null;
  if(vistaComp === 'diaria'){
    const fut = A.cumplimiento.filter(c => c.futuro).slice(0, 4);
    const pas = A.cumplimiento.filter(c => !c.futuro && diaVisible(c.fecha, c.comprometidos)).slice(-(BARRAS_COMP - fut.length));
    items = pas.concat(fut).map(barraCompDia);
    sub = '';
  } else if(enZoom){
    const p = periodosComp(vistaComp)[zoomComp];
    const dias = vistaComp === 'semanal'
      ? diasRango(p.desde, p.hasta).map(x => p.dias.find(d => d.fecha === x.iso) ||
          {fecha:x.iso, comprometidos:0, hechos:0, segs:{}, futuro: x.iso >= D.hoy}).filter(d => diaVisible(d.fecha, d.comprometidos))
      : p.dias.filter(d => diaVisible(d.fecha, d.comprometidos));
    items = dias.map(barraCompDia); detalleDias = dias.filter(d => d.comprometidos);
    titulo = `Cumplimiento · ${vistaComp === 'semanal' ? 'Sem ' + semanaIso(p.desde) : MESES[+p.clave.slice(5)-1] + ' ' + p.clave.slice(0,4)}`;
    sub = `${fLarga(p.desde)} a ${fLarga(p.hasta)} · ${fmt(p.hechos)} de ${fmt(p.comprometidos)} aceros comprometidos`;
  } else {
    const mensual = vistaComp === 'mensual', anio = D.hoy.slice(0, 4);
    items = periodosComp(vistaComp).map(p => {
      const e = estado(p.hechos, p.comprometidos), eA = estado(p.hastaAyer.hechos, p.hastaAyer.comprometidos);
      const mes = MESES[+p.clave.slice(5)-1];
      const nombre = mensual ? `${mes} ${p.clave.slice(0,4)}` : `Sem ${semanaIso(p.desde)} (${fCorta(p.desde)} – ${fCorta(p.hasta)})`;
      const extra = p.estado === 'curso'
        ? `<div class="r" style="margin-top:4px"><span>Hasta ayer</span><span>${fmt(p.hastaAyer.hechos)} de ${fmt(p.hastaAyer.comprometidos)} (${fmt(eA.pct*100)} %)</span></div>` : '';
      return {etiqueta: mensual ? mes.slice(0,3) + (p.clave.slice(0,4) !== anio ? ' ' + p.clave.slice(2,4) : '') : 'S' + semanaIso(p.desde),
        segs:conTarde(p), total:p.hechos + (p.tarde || 0), fondo:p.comprometidos, etiquetaValor:`${fmt(p.hechos + (p.tarde || 0))}/${fmt(p.comprometidos)}`,
        sub: p.estado === 'prog' ? 'prog.' : p.estado === 'curso' ? (p.hastaAyer.comprometidos ? `${fmt(eA.pct*100)} %` : 'en curso') : `${fmt(e.pct*100)} %`,
        subColor: p.estado === 'prog' || !p.hastaAyer.comprometidos ? 'var(--muted)' : COLOR_EST[(p.estado === 'curso' ? eA : e).cls],
        tip: tipSegs(nombre + (p.estado === 'curso' ? ' · en curso' : p.estado === 'prog' ? ' · programado' : ''), p.segs,
          filasComp(p, p.estado !== 'pasado') + extra + '<div style="margin-top:4px;opacity:.75">Clic para ver los días</div>')};
    });
    onClick = (it, i) => { zoomComp = i; dibujarCumplimiento(); };
    sub = '';
  }
  $('#comp-titulo').textContent = titulo;
  $('#comp-sub').textContent = sub;
  $('#comp-leyenda').innerHTML = leyendaMat(matsPresentes(items), '<span><i style="background:var(--pend)"></i>Pendiente</span>');
  barrasApiladas($('#ch-comp'), items, {sub:true, aria:'Cumplimiento de compromisos', onClick});
  $('#comp-detalle').innerHTML = detalleDias ? tablaEntregasComp(detalleDias) : '';
  dibujarRetenidasPiso();
}

const colorCat = c => COLOR_CAT[c] || PALETA[5];
let catMant = null, vistaMant = 'diaria';

// ---- Mantenimiento: orden de los vehículos, nombres a mostrar y los que se ocultan por ahora
const ORDEN_CAT = ['Retrofit', 'BMW X5', 'Land Rover Sentinel', 'Express Van'];
const CAT_OCULTAS = ['BMW Serie 7'];
const NOMBRE_CAT = {'Express Van':'Chevrolet Express Van'};
const nomCat = c => NOMBRE_CAT[c] || c;
const catsVisibles = M => [...ORDEN_CAT.filter(c => M.categorias.includes(c)),
                           ...M.categorias.filter(c => !ORDEN_CAT.includes(c) && !CAT_OCULTAS.includes(c))];

// ---- Mantenimiento: estadística de referencia. Un día se compara con los días del MISMO tipo
//      (laboral vs. domingo/festivo) de los últimos 30 días: mediana y rango normal (cuartiles 25 %–75 %).
function statsMant(M, laboral){
  const xs = M.diaria.filter(d => !d.hoy && !!d.lab === laboral).map(d => d.total).sort((a, b) => a - b);
  if(!xs.length) return null;
  const q = p => { const i = (xs.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return xs[lo] + (xs[hi] - xs[lo]) * (i - lo); };
  return {n: xs.length, prom: xs.reduce((a, b) => a + b, 0) / xs.length, p25: q(.25), med: q(.5), p75: q(.75), max: xs[xs.length - 1]};
}
function nivelMant(v, s){
  if(!s) return {cls:'neutral', ico:'○', txt:'Sin referencia'};
  if(v < s.p25) return {cls:'bad', ico:'▼', txt:'Bajo lo normal'};
  if(v > s.p75) return {cls:'ok', ico:'▲', txt:'Sobre lo normal'};
  return {cls:'ok', ico:'●', txt:'Normal'};
}
const tipoDia = laboral => laboral ? 'día laboral' : 'domingo/festivo';
// barra de rango: banda gris = rango normal, raya = mediana, punto (o relleno si el día va en curso) = el valor
function rangoMant(v, s, enCurso, cls){
  if(!s) return '';
  const max = Math.max(v, s.max, 1) * 1.08, pc = x => Math.min(100, x / max * 100);
  return `<div class="rango" title="Rango normal ${fmt(s.p25)}–${fmt(s.p75)} · mediana ${fmt(s.med)}">
      <span class="rango-banda" style="left:${pc(s.p25)}%;width:${Math.max(1, pc(s.p75) - pc(s.p25))}%"></span>
      ${enCurso ? `<span class="rango-fill" style="width:${pc(v)}%"></span>` : ''}
      <span class="rango-prom" style="left:${pc(s.med)}%"></span>
      ${enCurso ? '' : `<span class="rango-val" style="left:${pc(v)}%;background:${COLOR_EST[cls]}"></span>`}
    </div>
    <div class="rango-ley"><span>0</span><span>rango normal ${fmt(s.p25)}–${fmt(s.p75)} · mediana ${fmt(s.med)}</span><span>${fmt(Math.round(max))}</span></div>`;
}
function catsMant(M, campo){
  const xs = catsVisibles(M).map(c => ({c, n: (M.por_categoria.find(p => p.categoria === c) || {})[campo] || 0})).filter(x => x.n);
  const tot = xs.reduce((a, x) => a + x.n, 0);
  if(!tot) return '';
  return `<div class="catbar">${xs.map(x => `<i style="width:${x.n / tot * 100}%;background:${colorCat(x.c)}" title="${esc(nomCat(x.c))}: ${x.n}"></i>`).join('')}</div>
    <div class="catley">${xs.map(x => `<span><i style="background:${colorCat(x.c)}"></i>${esc(nomCat(x.c))} <b>${fmt(x.n)}</b></span>`).join('')}</div>`;
}
const nombreCorto = n => { const p = String(n || '').split(/\s+/); return p.length > 2 ? `${p[0]} ${p[p.length > 3 ? 2 : 1]}` : n; };
function tecsMant(M, campo){
  const xs = M.personas.filter(p => p[campo]).sort((a, b) => b[campo] - a[campo]);
  if(!xs.length) return '<div class="tecs">Sin matriceros con mantenimientos finalizados</div>';
  const tot = xs.reduce((a, p) => a + p[campo], 0);
  return `<div class="tecs">${xs.slice(0, 4).map(p => `<span title="${esc(p.nombre)}">${esc(nombreCorto(p.nombre))} <b>${fmt(p[campo])}</b></span>`).join('')}${xs.length > 4 ? `<span>+${xs.length - 4} más</span>` : ''}</div>
    <div class="mk-ref"><b>${fmt(tot / xs.length, 1)}</b> por matricero · ${fmt(xs.length)} ${xs.length === 1 ? 'matricero' : 'matriceros'}</div>`;
}
function tarjetasMant(M){
  const k = M.kpis, hoyD = M.diaria.find(d => d.hoy), ayerD = M.diaria.find(d => d.fecha === k.fecha_ayer);
  const labHoy = hoyD ? !!hoyD.lab : true, labAyer = ayerD ? !!ayerD.lab : true;
  const sHoy = statsMant(M, labHoy), sAyer = statsMant(M, labAyer);
  const eAyer = nivelMant(k.ayer, sAyer);
  const avance = sHoy && sHoy.med ? k.hoy / sHoy.med : null;
  return `<div class="grid-mant">
    <div class="kpi hero mk">
      <div class="lbl"><span>${t('mant_hoy')}</span><span class="chip ok">● ${t('en_vivo')}</span></div>
      <div class="val">${fmt(k.hoy)} <small>${sHoy ? `de ~${fmt(sHoy.med)} en un ${tipoDia(labHoy)} típico` : 'finalizados'}</small></div>
      ${avance != null ? `<div class="mk-ref">Avance del día: <b>${fmt(avance * 100)} %</b> de lo típico</div>` : ''}
      ${rangoMant(k.hoy, sHoy, true)}
      <div class="mk-sep"><div class="mk-tit">Por vehículo</div>${catsMant(M, 'hoy') || '<div class="mk-ref">Aún sin finalizados hoy</div>'}</div>
      <div class="mk-sep"><div class="mk-tit">Matriceros hoy</div>${tecsMant(M, 'hoy')}</div>
    </div>
    <div class="kpi hero mk">
      <div class="lbl"><span>${t('mant_ayer')} ${fCorta(k.fecha_ayer)}</span><span class="chip ${eAyer.cls}">${eAyer.ico} ${eAyer.txt}</span></div>
      <div class="val">${fmt(k.ayer)} <small>${sAyer ? `vs. ${fmt(sAyer.med)} de un ${tipoDia(labAyer)} típico` : 'finalizados'}</small></div>
      ${sAyer ? `<div class="mk-ref">${Math.round(k.ayer - sAyer.med) === 0 ? 'Igual a' : `<b>${k.ayer > sAyer.med ? '+' : ''}${fmt(k.ayer - sAyer.med)}</b> frente a`} la mediana de los ${fmt(sAyer.n)} ${labAyer ? 'días laborales' : 'domingos/festivos'} del mes</div>` : ''}
      ${rangoMant(k.ayer, sAyer, false, eAyer.cls)}
      <div class="mk-sep"><div class="mk-tit">Por vehículo</div>${catsMant(M, 'ayer') || '<div class="mk-ref">Sin finalizados</div>'}</div>
      <div class="mk-sep"><div class="mk-tit">Matriceros · ${fCorta(k.fecha_ayer)}</div>${tecsMant(M, 'ayer')}</div>
    </div>
  </div>`;
}

// ================================================================ Resumen: secciones con gráfica por periodo
// Componente reutilizable (Mantenimiento hoy; Fabricación de moldes y Serigrafía después). Cada servicio registra un
// bloque en BLOQUES_RESUMEN con:
//   id                 prefijo de los elementos (#<id>-titulo, #<id>-vista, #<id>-volver, #<id>-sub, #<id>-leyenda, #ch-<id>)
//   titulo, aria       textos de la gráfica
//   periodos(vista)    barras de 'diaria' | 'semanal' | 'mensual': [{etiqueta, nombre, segs, total, enCurso, futuro, nota, desde, hasta, detalle}]
//   dias(desde, hasta) barras de los días de una semana (para el detalle)
//   mediana(vista)     valor de la línea de referencia (o null) y su unidad
//   op                 {orden, colores, nombres} para apilar, la leyenda y el tooltip
//   estado             {vista, zoom} propio del bloque
const BLOQUES_RESUMEN = [];
function htmlGraficaResumen(id, titulo){
  return `<div class="kpi ra-chart">
    <div class="lbl"><span id="${id}-titulo">${esc(titulo)}</span>
      <span class="prod-ctrl"><button class="btn-volver" id="${id}-volver" hidden>← Semanas</button>
        <span class="seg" id="${id}-vista"><button aria-pressed="true" data-v="diaria">${t('diario')}</button><button aria-pressed="false" data-v="semanal">${t('semanal')}</button><button aria-pressed="false" data-v="mensual">${t('mensual')}</button></span></span></div>
    <div class="desc" id="${id}-sub"></div>
    <div id="${id}-leyenda"></div>
    <div class="chart" id="ch-${id}"></div>
  </div>`;
}
function dibujarGraficaResumen(b){
  const cont = $('#ch-' + b.id); if(!cont) return;
  const e = b.estado, zoom = e.vista === 'semanal' && e.zoom;
  document.querySelectorAll(`#${b.id}-vista button`).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === e.vista));
  $(`#${b.id}-volver`).hidden = !zoom;
  const barras = zoom ? b.dias(e.zoom.desde, e.zoom.hasta) : b.periodos(e.vista);
  const items = barras.map(x => ({etiqueta: x.etiqueta, segs: x.segs, total: x.total, etiquetaValor: x.futuro ? '' : undefined,
    sub: x.enCurso ? 'en curso' : (x.nota || ''), subColor: 'var(--muted)',
    tip: tipSegs(x.nombre + (x.enCurso ? ' · en curso' : ''), x.segs,
      `<div class="r" style="margin-top:6px;border-top:1px solid #ffffff33;padding-top:4px"><span>${t('total')}</span><span>${x.futuro ? '—' : fmt(x.total)}</span></div>` +
      (e.vista === 'semanal' && !zoom ? `<div style="margin-top:4px;opacity:.75">${x.detalle ? 'Clic para ver los días' : 'Detalle por día disponible al reiniciar el servidor'}</div>` : ''), b.op)}));
  const med = b.mediana(zoom ? 'diaria' : e.vista);
  $(`#${b.id}-titulo`).textContent = zoom ? `${b.titulo} · ${e.zoom.titulo}` : b.titulo;
  $(`#${b.id}-sub`).textContent = '';
  $(`#${b.id}-leyenda`).innerHTML = `<div class="legend">${b.op.orden.map(c => `<span><i style="background:${b.op.colores[c]}"></i>${esc((b.op.nombres || {})[c] || c)}</span>`).join('')}` +
    (med.valor != null ? `<span><i class="linea punteada" style="color:var(--text)"></i>Mediana ${b.agrupada ? 'del total ' : ''}por ${med.unidad}</span>` : '') + '</div>';
  const onClick = e.vista === 'semanal' && !zoom ? (it, i) => { const x = barras[i]; if(!x.detalle) return;
      e.zoom = {desde: x.desde, hasta: x.hasta, titulo: x.nombre}; dibujarGraficaResumen(b); } : null;
  const referencias = med.valor != null ? [{valor: med.valor, color: 'var(--text)', etiqueta: `Mediana ${b.agrupada ? 'del total ' : ''}${fmt(med.valor, med.valor % 1 ? 1 : 0)}`}] : [];
  if(b.agrupada){ // una barra por serie (vehículo) con su número; debajo, el total del periodo
    barrasAgrupadas(cont, barras.map((x, i) => ({etiqueta: x.etiqueta, valores: x.segs, tip: items[i].tip,
      sub: x.futuro ? (x.nota || '') : `Total ${fmt(x.total)}${x.enCurso ? ' · en curso' : ''}`, subCorto: x.futuro ? '' : fmt(x.total), subColor: x.enCurso || x.futuro ? 'var(--muted)' : 'var(--text-soft)'})),
      {...b.op, alto: 280, aria: b.aria, onClick, referencias});
  } else barrasApiladas(cont, items, {...b.op, sub: true, alto: 280, aria: b.aria, onClick, referencias, numSegmentos: !!b.numSegmentos});
}
document.addEventListener('click', ev => {
  for(const b of BLOQUES_RESUMEN){
    const bv = ev.target.closest(`#${b.id}-vista button`);
    if(bv){ b.estado.vista = bv.dataset.v; b.estado.zoom = null; dibujarGraficaResumen(b); return; }
    if(ev.target.closest(`#${b.id}-volver`)){ b.estado.zoom = null; dibujarGraficaResumen(b); return; }
  }
});

// ---- Mantenimiento de moldes en el Resumen: mismas series, filtros y orden que el módulo (sin el filtro por clic
//      en un vehículo, que es propio del módulo). Los días salen de "registros" (13 meses) o, si el servidor aún no
//      los envía, de la serie diaria de 30 días.
const segsSinOcultos = segs => { const s = {}; for(const k in segs) if(!CAT_OCULTAS.includes(k)) s[k] = segs[k]; return s; };
let cacheDiasMant = {ref: null, dias: {}};
function diasMant(M){ // fecha → segs por vehículo (sin ocultos)
  if(cacheDiasMant.ref === M) return cacheDiasMant.dias;
  const dias = {};
  if(M.registros){
    const R = M.registros;
    for(const r of R.filas){ const c = R.categorias[r[2]]; if(CAT_OCULTAS.includes(c)) continue; const s = dias[r[0]] = dias[r[0]] || {}; s[c] = (s[c] || 0) + 1; }
  } else M.diaria.forEach(d => dias[d.fecha] = segsSinOcultos(d.segs));
  cacheDiasMant = {ref: M, dias};
  return dias;
}
const medianaDe = xs => { if(!xs.length) return null; const s = [...xs].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const BLOQUE_RESUMEN_MANT = {
  id: 'rm', titulo: 'Histórico de mantenimientos finalizados', aria: 'Mantenimientos finalizados por periodo y vehículo', numSegmentos: true,
  estado: {vista: 'diaria', zoom: null},
  get op(){ const M = D.mantenimiento; return {orden: catsVisibles(M), colores: COLOR_CAT, nombres: NOMBRE_CAT}; },
  dias(desde, hasta){
    const M = D.mantenimiento, dias = diasMant(M), primero = M.registros ? '0000' : M.diaria[0].fecha;
    return diasRango(desde, hasta).map(d => {
      const segs = d.iso >= primero ? (dias[d.iso] || {}) : {}, futuro = d.iso > D.hoy;
      return {etiqueta: d.iso === D.hoy ? t('hoy') : fCorta(d.iso), nombre: fLarga(d.iso), segs, total: totalSegs(segs), futuro,
              enCurso: d.iso === D.hoy, iso: d.iso, nota: futuro ? '' : d.festivo ? 'Festivo' : d.domingo ? 'Domingo' : ''};
    }).filter(x => diaVisible(x.iso, x.total));
  },
  periodos(vista){
    const M = D.mantenimiento;
    if(vista === 'diaria'){ const l = lunesDe(D.hoy); return this.dias(l, sumarDias(l, 6)); }  // solo la semana actual
    const primero = M.registros ? '0000' : M.diaria[0].fecha;
    return M[vista].map(p => {
      const segs = segsSinOcultos(p.segs), mensual = vista === 'mensual';
      return {etiqueta: mensual ? MESES[+p.etiqueta.slice(5) - 1].slice(0, 3) : p.etiqueta.replace('Sem ', 'S'),
              nombre: mensual ? `${MESES[+p.etiqueta.slice(5) - 1]} ${p.etiqueta.slice(0, 4)}` : `${p.etiqueta} (${fCorta(p.desde)} – ${fCorta(p.hasta)})`,
              segs, total: totalSegs(segs), enCurso: p.en_curso, desde: p.desde, hasta: p.hasta,
              detalle: !mensual && p.desde >= primero};
    });
  },
  mediana(vista){ // igual que en el módulo: días laborales / semanas cerradas / meses cerrados
    const M = D.mantenimiento;
    const xs = vista === 'diaria' ? M.diaria.filter(d => !d.hoy && d.lab).map(d => totalSegs(segsSinOcultos(d.segs)))
                                  : M[vista].filter(p => !p.en_curso).map(p => totalSegs(segsSinOcultos(p.segs)));
    return {valor: medianaDe(xs), unidad: vista === 'diaria' ? 'día laboral' : vista === 'semanal' ? 'semana' : 'mes'};
  },
  dibujar(){ if(D.mantenimiento) dibujarGraficaResumen(this); },
};
BLOQUES_RESUMEN.push(BLOQUE_RESUMEN_MANT);

// Renglones "cantidad vs. media" con el mismo formato de "Producción por matricero" de Aceros.
// filas: [{nombre, n, media, color}]; el total compara la suma contra la suma de las medias.
function vsMediaHTML(filas, tituloTotal){
  const max = Math.max(1, ...filas.map(f => Math.max(f.n, f.media)));
  const tot = filas.reduce((a, f) => a + f.n, 0), medTot = filas.reduce((a, f) => a + f.media, 0), eT = estado(tot, medTot);
  return `<div class="matr">${filas.map(f => { const e = estado(f.n, f.media);
    return `<div class="matr-fila" title="${esc(f.nombre)}: ${fmt(f.n)} · media ${fmt(f.media, 1)}">
      <span class="matr-nom">${esc(f.nombre)}</span>
      <span class="matr-bar">${f.n ? `<i style="width:${f.n / max * 100}%;background:${f.color}"><em class="num" style="color:${tintaSobre(f.color)}">${fmt(f.n)}</em></i>` : `<em class="num cero">0</em>`}${f.media ? `<b style="left:${f.media / max * 100}%"></b>` : ''}</span>
      <span class="matr-meta">media <b class="num">${fmt(f.media, 1)}</b></span>
      <span class="matr-e" style="color:${COLOR_EST[e.cls]}">${e.pct != null ? `${e.ico} ${fmt(e.pct * 100)} %` : '—'}</span></div>`; }).join('')}
    <div class="matr-fila matr-tot"><span class="matr-nom">${tituloTotal}</span><span class="num" style="font-size:15px">${fmt(tot)}</span>
      <span class="matr-meta">media <b class="num">${fmt(medTot, 1)}</b></span>
      <span class="matr-e" style="color:${COLOR_EST[eT.cls]}">${eT.pct != null ? `${eT.ico} ${fmt(eT.pct * 100)} %` : ''}</span></div></div>`;
}
// media de un vehículo en los días del mismo tipo (laboral vs. domingo/festivo) de los últimos 30 días, sin hoy
function mediaMant(M, cat, laboral){
  const dias = M.diaria.filter(d => !d.hoy && !!d.lab === laboral);
  return dias.length ? dias.reduce((a, d) => a + ((d.segs || {})[cat] || 0), 0) / dias.length : 0;
}

function tarjetaResumenMant(M){
  if(!M) return `<article class="serv-largo"><div class="sl-head"><h3>${t('mantenimiento')}</h3><span class="chip bad">✖ Sin conexión</span></div></article>`;
  const k = M.kpis, ayerD = M.diaria.find(d => d.fecha === k.fecha_ayer), labAyer = ayerD ? !!ayerD.lab : true;
  const cats = catsVisibles(M), porCat = c => M.por_categoria.find(p => p.categoria === c) || {};
  const filasAyer = cats.map(c => ({nombre: nomCat(c), n: porCat(c).ayer || 0, media: mediaMant(M, c, labAyer), color: colorCat(c)}));
  const totAyer = filasAyer.reduce((a, f) => a + f.n, 0), medAyer = filasAyer.reduce((a, f) => a + f.media, 0), eAyer = estado(totAyer, medAyer);
  const hoyCats = cats.map(c => ({c, n: porCat(c).hoy || 0})).filter(x => x.n), totHoy = hoyCats.reduce((a, x) => a + x.n, 0);
  return `<article class="serv-largo">

      <div class="ra-col">

          <div class="lbl"><span>${t('mant_ayer')} ${fCorta(k.fecha_ayer)}</span>${chip(eAyer)}</div>
          ${vsMediaHTML(filasAyer, 'Total del día')}
          <div class="desc">Media de ${labAyer ? 'días laborales' : 'domingos/festivos'} · 30 días</div>
        </div>
        <div class="kpi">
          <div class="lbl"><span>${t('mant_hoy')}</span><span class="chip ok">● ${t('en_vivo')}</span></div>
          <div class="val">${fmt(totHoy)} <small>mantenimientos</small></div>
          <div class="desc">${hoyCats.length ? hoyCats.map(x => `<span style="white-space:nowrap"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:${colorCat(x.c)}"></i>${esc(nomCat(x.c))} <b>${fmt(x.n)}</b></span>`).join(' · ') : 'Aún sin finalizados hoy'}</div>
        </div>
      </div>
      ${htmlGraficaResumen(BLOQUE_RESUMEN_MANT.id, BLOQUE_RESUMEN_MANT.titulo)}
    </div></article>`;
}

// ---- Análisis por periodo: la matriz por matricero, la distribución por tipo y los moldes recurrentes se arman en
//      el navegador desde los registros de lo finalizado (≈13 meses). Diario = 14 días; Semanal = 12 semanas (clic en
//      una semana = sus 7 días); Mensual = 12 meses (clic en un mes = sus semanas). Respeta el filtro por vehículo.
let vistaMat = 'diaria', zoomMat = null, modoMat = 'ranking';
const sumarDias = (iso, n) => { const f = fecha(iso); f.setDate(f.getDate() + n); return isoDe(f); };
const fDiaMes = iso => { const f = fecha(iso); return `${f.getDate()} ${MESES[f.getMonth()].slice(0,3).toLowerCase()}`; };
const hexA = (hex, a) => { const h = hex.replace('#',''); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; };
function periodosMat(){
  const hoy = D.hoy, out = [];
  const dia = iso => { const f = fecha(iso), i = infoDia(iso);
    return {desde: iso, hasta: iso, et1: DIAS[f.getDay()], et2: String(f.getDate()), titulo: fLarga(iso), lab: i.lab, actual: iso === hoy, unidad: 'día'}; };
  const semana = lunes => { const dom = sumarDias(lunes, 6);
    return {desde: lunes, hasta: dom, et1: 'S' + semanaIso(lunes), et2: fDiaMes(lunes), titulo: `Semana ${semanaIso(lunes)} · ${fDiaMes(lunes)} – ${fDiaMes(dom)}`,
            lab: true, actual: lunes <= hoy && hoy <= dom, zoom: vistaMat === 'semanal', unidad: 'semana'}; };
  if(vistaMat === 'diaria'){ for(let k = 13; k >= 0; k--) out.push(dia(sumarDias(hoy, -k))); return out; }
  if(vistaMat === 'semanal'){
    if(zoomMat) return diasRango(zoomMat.desde, zoomMat.hasta).map(d => dia(d.iso));
    const l = lunesDe(hoy); for(let k = 11; k >= 0; k--) out.push(semana(sumarDias(l, -7 * k))); return out;
  }
  if(zoomMat){ // semanas del mes, recortadas a sus días
    for(let l = lunesDe(zoomMat.desde); l <= zoomMat.hasta && l <= hoy; l = sumarDias(l, 7)){ // sin semanas que aún no llegan
      const s = semana(l); s.desde = s.desde < zoomMat.desde ? zoomMat.desde : s.desde; s.hasta = s.hasta > zoomMat.hasta ? zoomMat.hasta : s.hasta;
      s.et2 = fDiaMes(s.desde); s.titulo = `Semana ${semanaIso(l)} · ${fDiaMes(s.desde)} – ${fDiaMes(s.hasta)}`; s.zoom = false; out.push(s);
    }
    return out;
  }
  const f = fecha(hoy);
  for(let k = 11; k >= 0; k--){
    const a = new Date(f.getFullYear(), f.getMonth() - k, 1), desde = isoDe(a), hasta = isoDe(new Date(a.getFullYear(), a.getMonth() + 1, 0));
    out.push({desde, hasta, et1: MESES[a.getMonth()].slice(0,3), et2: String(a.getFullYear()).slice(2), titulo: `${MESES[a.getMonth()]} ${a.getFullYear()}`,
              lab: true, actual: desde <= hoy && hoy <= hasta, zoom: true, unidad: 'mes'});
  }
  return out;
}
function analisisMat(M){
  const R = M.registros, cols = periodosMat(), desde = cols[0].desde, hasta = cols[cols.length - 1].hasta;
  const visibles = new Set(catsVisibles(M).filter(c => !catMant || c === catMant));
  const nuevo = () => ({total: 0, n: cols.map(() => 0), segs: cols.map(() => ({})), tipos: cols.map(() => ({}))});
  const per = {}, tip = {}, mol = {}, equipo = nuevo();
  for(const r of (R ? R.filas : [])){
    if(r[0] < desde || r[0] > hasta) continue;
    const cat = R.categorias[r[2]]; if(!visibles.has(cat)) continue;
    const i = cols.findIndex(c => r[0] >= c.desde && r[0] <= c.hasta); if(i < 0) continue;
    const nombre = R.personas[r[1]], tipo = R.tipos[r[3]], molde = R.moldes[r[4]];
    for(const x of [per[nombre] = per[nombre] || nuevo(), equipo]){
      x.total++; x.n[i]++; x.segs[i][cat] = (x.segs[i][cat] || 0) + 1; x.tipos[i][tipo] = (x.tipos[i][tipo] || 0) + 1;
    }
    const tp = tip[tipo] = tip[tipo] || {n: 0, serie: cols.map(() => 0)}; tp.n++; tp.serie[i]++;
    const m = mol[molde] = mol[molde] || {n: 0, cat, vehiculo: R.vehiculos[r[5]], personas: new Set(), ultima: r[0]};
    m.n++; m.personas.add(nombre); if(r[0] > m.ultima) m.ultima = r[0];
  }
  return {cols, desde, hasta, equipo,
    personas: Object.entries(per).map(([nombre, x]) => ({nombre, ...x, activos: x.n.filter(v => v).length})).sort((a, b) => b.total - a.total),
    tipos: Object.entries(tip).map(([tipo, x]) => ({tipo, ...x})).sort((a, b) => b.n - a.n),
    moldes: Object.entries(mol).filter(([, x]) => x.n > 1).map(([molde, x]) => ({molde, ...x})).sort((a, b) => b.n - a.n || (a.ultima < b.ultima ? 1 : -1)).slice(0, 10)};
}
// Respaldo si el servidor todavía no envía "registros": diario sale de la matriz de 14 días que ya existía;
// tipos y moldes, de los acumulados de 30 días. Semanal y mensual necesitan los registros.
function analisisBasico(M){
  if(vistaMat !== 'diaria' || zoomMat) return null;
  const cols = periodosMat(), idx = Object.fromEntries(cols.map((c, i) => [c.desde, i]));
  const nuevo = () => ({total: 0, n: cols.map(() => 0), segs: cols.map(() => ({})), tipos: cols.map(() => ({}))});
  const equipo = nuevo();
  const personas = M.personas.map(p => {
    const x = nuevo();
    p.celdas.forEach(c => { const i = idx[c.fecha]; if(i == null) return; const s = segsFiltrados(c.segs), n = totalSegs(s);
      x.n[i] += n; x.total += n; x.segs[i] = s; equipo.n[i] += n; equipo.total += n;
      for(const k in s) equipo.segs[i][k] = (equipo.segs[i][k] || 0) + s[k]; });
    return {nombre: p.nombre, ...x, activos: x.n.filter(v => v).length};
  }).filter(p => p.total).sort((a, b) => b.total - a.total);
  const visibles = new Set(catsVisibles(M).filter(c => !catMant || c === catMant));
  return {cols, desde: cols[0].desde, hasta: cols[cols.length - 1].hasta, equipo, personas, parcial: true,
    tipos: catMant ? [] : M.tipos_30.map(x => ({tipo: x.tipo, n: x.n, serie: null})),
    moldes: M.reincidentes_30.filter(r => visibles.has(r.categoria))
      .map(r => ({molde: r.molde, n: r.n, cat: r.categoria, vehiculo: r.vehiculo, personas: null, ultima: null}))};
}

function sparkMini(serie, color){

// Producción vs. capacidad de un bloque de Serigrafía con filtros Diario (días productivos de los últimos 30) /
// Semanal (12 semanas, clic = sus días productivos) / Mensual (12 meses). Barras = lo hecho por persona; capacidad en
// rojo (vitros: la de Indicadores diarios; logos y pasta de plata: la diaria escrita × días productivos); línea = carga.
const estadoSeri = {};
// Formato común de las gráficas de Serigrafía (como el Excel "Procesamiento de Vitros"): barras = lo hecho, línea azul
// arriba = capacidad, línea punteada roja = piezas quietas (solo donde hay dato). Diario / Semanal (clic = días) / Mensual.
//   Vitros estándar: Indicadores diarios, hoja VITROJET (vitros nuevos, piezas quietas, capacidad; si no hay
//                    capacidad, la "Cap./día ✎").
//   Vitros logos y pasta de plata: lo hecho de cada Excel; capacidad = "Cap./día ✎" × días productivos.
const SERI_FORMATO = {
  logos:       {titulo: 'Producción diaria vs. capacidad', barra: 'Vitros logo hechos'},
  vitros:      {titulo: 'Procesamiento de vitros',        barra: 'Vitros nuevos'},
  pasta_plata: {titulo: 'Producción diaria vs. capacidad', barra: 'Vitros PP hechos'},
};
function datosSeri(S, b){
  const X = S[b.id], capManual = b.capManual ? valorManual(b.capManual, null) : null;
  const dia = {};
  if(b.id === 'vitros' && S.retenidas && S.retenidas.serie)
    S.retenidas.serie.forEach(d => dia[d.fecha] = {nuevos: d.vitros_nuevos || 0, quietas: d.vitro_quietas || 0, cap: d.capacidad});
  else ((X.serie && X.serie.diaria) || []).forEach(d => dia[d.fecha] = {nuevos: d.total || 0, quietas: null, cap: null});
  // Vitros logos: la hoja "Gráfica" del Excel trae lo hecho (CARGA) y la CAPACIDAD de cada día desde enero
  const grafica = b.id === 'logos' && X.grafica ? X.grafica : {};
  for(const f in grafica){ const g = grafica[f], d = dia[f] || {nuevos: 0, quietas: null, cap: null};
    dia[f] = {nuevos: g.carga != null ? g.carga : d.nuevos, quietas: null, cap: g.capacidad != null ? g.capacidad : d.cap}; }
  const usaDias = b.id === 'vitros' || Object.keys(grafica).length > 0;   // historia día a día: semanas y meses se suman
  const capDia = iso => { const d = dia[iso]; return d && d.cap != null ? d.cap : (capManual && esDiaProductivo(iso) && iso <= D.hoy ? capManual : null); };
  const conQuietas = b.id === 'vitros';
  // agregados: vitros suma los días (hay ~13 meses); logos y pasta de plata usan las series semanal/mensual del servidor
  const rango = (desde, hasta, totalServidor) => { const r = {nuevos: 0, quietas: 0, cap: 0, hayCap: false, hay: false};
    diasRango(desde, hasta).forEach(x => { const d = dia[x.iso], c = capDia(x.iso);
      if(c != null){ r.cap += c; r.hayCap = true; }
      if(d){ r.hay = true; r.nuevos += d.nuevos; r.quietas += d.quietas || 0; } });
    if(totalServidor != null){ r.nuevos = totalServidor; r.hay = true; }
    if(!conQuietas) r.quietas = null;
    return r; };
  return {X, dia, rango, conQuietas, capManual, usaDias};
}
function dibujarSeriFormato(S, b, e, cont){
  const zoom = e.vista === 'semanal' && e.zoom, F = SERI_FORMATO[b.id], Q = datosSeri(S, b);
  document.querySelectorAll(`[data-seri-vista="${b.id}"] button`).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === e.vista));
  $('#vol-seri-' + b.id).hidden = !zoom;
  const serv = (Q.X && Q.X.serie) || {};
  let per = [];
  if(zoom || e.vista === 'diaria'){
    const desde = zoom ? e.zoom.desde : sumarDias(D.hoy, -29), hasta = zoom ? e.zoom.hasta : D.hoy;
    per = diasRango(desde, hasta).filter(x => Q.dia[x.iso] && diaVisible(x.iso, Q.dia[x.iso].nuevos))
      .map(x => ({...Q.rango(x.iso, x.iso), etiqueta: x.iso === D.hoy ? t('hoy') : fCorta(x.iso), nombre: fLarga(x.iso), enCurso: x.iso === D.hoy}));
  } else if(e.vista === 'semanal'){
    const l = lunesDe(D.hoy);
    for(let k = 11; k >= 0; k--){ const ini = sumarDias(l, -7 * k), fin = sumarDias(ini, 6);
      const s = Q.usaDias ? null : (serv.semanal || []).find(x => x.desde === ini);
      per.push({...Q.rango(ini, fin, s ? s.total : (Q.usaDias ? null : 0)), desde: ini, hasta: fin, etiqueta: 'S' + semanaIso(ini),
                nombre: `Semana ${semanaIso(ini)} (${fCorta(ini)} – ${fCorta(fin)})`, enCurso: fin >= D.hoy}); }
  } else {
    const f = fecha(D.hoy);
    for(let k = 11; k >= 0; k--){ const a = new Date(f.getFullYear(), f.getMonth() - k, 1), ini = isoDe(a), fin = isoDe(new Date(a.getFullYear(), a.getMonth() + 1, 0));
      const s = Q.usaDias ? null : (serv.mensual || []).find(x => x.desde === ini);
      per.push({...Q.rango(ini, fin, s ? s.total : (Q.usaDias ? null : 0)), etiqueta: MESES[a.getMonth()].slice(0, 3),
                nombre: `${MESES[a.getMonth()]} ${a.getFullYear()}`, enCurso: fin >= D.hoy}); }
  }
  const op = {orden: [F.barra], colores: {[F.barra]: PALETA[0]}};
  const items = per.map(p => ({etiqueta: p.etiqueta, segs: {[F.barra]: p.nuevos}, total: p.nuevos,
    sub: p.enCurso ? 'en curso' : (p.hayCap && p.cap ? `${fmt(p.nuevos / p.cap * 100)} %` : ''),
    subColor: p.enCurso || !p.hayCap ? 'var(--muted)' : COLOR_EST[estado(p.nuevos, p.cap).cls],
    tip: `<b>${esc(p.nombre)}${p.enCurso ? ' · en curso' : ''}</b>` +
      `<div class="r" style="margin-top:6px"><span>${F.barra}</span><span>${fmt(p.nuevos)}</span></div>` +
      (Q.conQuietas ? `<div class="r"><span>Piezas quietas</span><span>${fmt(p.quietas)}</span></div>` : '') +
      `<div class="r"><span>Capacidad</span><span>${p.hayCap ? fmt(p.cap) : 'sin dato'}</span></div>` +
      (e.vista === 'semanal' && !zoom ? '<div style="margin-top:4px;opacity:.75">Clic para ver los días</div>' : '')}));
  const tituloBase = zoom || e.vista === 'diaria' ? F.titulo : F.titulo.replace('diaria', e.vista === 'semanal' ? 'semanal' : 'mensual');
  $('#tit-seri-' + b.id).textContent = zoom ? `${F.titulo} · ${e.zoom.titulo}` : tituloBase;
  $('#ley-seri-' + b.id).innerHTML = `<div class="legend"><span><i style="background:${PALETA[0]}"></i>${F.barra}</span>` +
    (Q.conQuietas ? `<span><i class="linea puntos" style="color:var(--bad)"></i>Piezas quietas</span>` : '') +
    `<span><i class="linea punteada" style="color:${COLOR_META}"></i>Capacidad</span></div>`;
  const lineas = [{vals: per.map(p => p.hayCap ? p.cap : null), color: COLOR_META, etiquetas: 'ultima', punteada: true}];
  if(Q.conQuietas) lineas.unshift({vals: per.map(p => p.hay ? p.quietas : null), color: 'var(--bad)', etiquetas: 'todas', punteada: 'puntos', sinPuntos: true});
  barrasApiladas(cont, items, {...op, sub: true, alto: 260, aria: F.titulo,
    onClick: e.vista === 'semanal' && !zoom ? (it, i) => { const p = per[i]; e.zoom = {desde: p.desde, hasta: p.hasta, titulo: p.nombre}; dibujarSeriFormato(S, b, e, cont); } : null,
    lineas});
}
function dibujarBloqueSeri(S, b){
  const X = S[b.id], cont = $('#ch-seri-' + b.id); if(!X || !cont) return;
  const e = estadoSeri[b.id] = estadoSeri[b.id] || {vista: 'diaria', zoom: null};
  return dibujarSeriFormato(S, b, e, cont);   // mismo formato en las 3 gráficas (ver abajo)
  const zoom = e.vista === 'semanal' && e.zoom;
  document.querySelectorAll(`[data-seri-vista="${b.id}"] button`).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === e.vista));
  $('#vol-seri-' + b.id).hidden = !zoom;
  const capManual = b.capManual ? valorManual(b.capManual, null) : null;
  const ser = X.serie || {diaria: X.diaria.map((d, i) => ({...d, segs: Object.fromEntries(X.personas.filter(p => p.celdas[i]).map(p => [p.nombre, p.celdas[i]]))}))};
  const nombres = [...new Set([...(ser.diaria || []), ...(ser.semanal || []), ...(ser.mensual || [])].flatMap(p => Object.keys(p.segs || {})))];
  const colores = {}; nombres.forEach((n, i) => colores[n] = PALETA_PERSONAS[i % PALETA_PERSONAS.length]);
  const op = {orden: nombres, colores};
  // carga: pasta de plata = "Vitros PP" de Indicadores diarios; los demás = foto diaria (hoy en vivo)
  const hist = S.historial || {}, indCarga = {logos:'seri_carga_logos', vitros:'seri_carga_vitros', pasta_plata:'seri_carga_pp_comp'}[b.id];
  const cargaPP = (S.retenidas && S.retenidas.carga_pp) || {};
  const cargaDia = iso => b.id === 'pasta_plata' ? (cargaPP[iso] != null ? cargaPP[iso] : null)
    : iso === D.hoy ? X.carga : (hist[iso] && hist[iso][indCarga] != null ? hist[iso][indCarga] : null);
  const cargaRango = (desde, hasta) => { let v = null; diasRango(desde, hasta < D.hoy ? hasta : D.hoy).forEach(d => { const c = cargaDia(d.iso); if(c != null) v = c; }); return v; };
  const capRangoSeri = p => b.id === 'vitros' ? p.capacidad
    : capManual ? capManual * diasRango(p.desde, p.hasta).filter(d => esProductivo(d.iso)).length : null;
  let periodos;
  if(zoom) periodos = (ser.diaria || []).filter(d => d.fecha >= e.zoom.desde && d.fecha <= e.zoom.hasta && diaVisible(d.fecha, d.total));
  else if(e.vista === 'diaria') periodos = (ser.diaria || []).filter(d => diaVisible(d.fecha, d.total));
  else periodos = ser[e.vista] || [];
  const porDia = zoom || e.vista === 'diaria', mensual = e.vista === 'mensual' && !zoom;
  const filas = periodos.map(p => {
    const cap = porDia ? (b.id === 'vitros' ? p.capacidad : capManual) : capRangoSeri(p);
    const carga = porDia ? cargaDia(p.fecha) : cargaRango(p.desde, p.hasta);
    const etiqueta = porDia ? (p.fecha === D.hoy ? t('hoy') : fCorta(p.fecha)) : mensual ? MESES[+p.etiqueta.slice(5) - 1].slice(0, 3) : p.etiqueta.replace('Sem ', 'S');
    const nombre = porDia ? fLarga(p.fecha) : mensual ? `${MESES[+p.etiqueta.slice(5) - 1]} ${p.etiqueta.slice(0, 4)}` : `${p.etiqueta} (${fCorta(p.desde)} – ${fCorta(p.hasta)})`;
    const enCurso = porDia ? p.hoy : p.en_curso, eC = cap ? estado(p.total, cap) : null;
    return {carga, item:{etiqueta, segs: p.segs || {}, total: p.total, meta: cap || undefined,
      sub: enCurso ? 'en curso' : eC ? `${fmt(eC.pct * 100)} %` : '', subColor: enCurso || !eC ? 'var(--muted)' : COLOR_EST[eC.cls],
      tip: tipSegs(nombre + (enCurso ? ' · en curso' : ''), p.segs || {}, `<div class="r" style="margin-top:6px"><span>${t('total')}</span><span>${fmt(p.total)}</span></div>` +
        (cap ? `<div class="r"><span>Capacidad</span><span>${fmt(cap)}</span></div>` : '') +
        `<div class="r"><span>Carga${porDia ? ' del día' : ' (último dato)'}</span><span>${carga == null ? 'sin dato' : fmt(carga)}</span></div>` +
        (e.vista === 'semanal' && !zoom ? '<div style="margin-top:4px;opacity:.75">Clic para ver los días</div>' : ''), op)}};
  });
  $('#tit-seri-' + b.id).textContent = zoom ? `Producción vs. capacidad · ${e.zoom.titulo}` : porDia ? 'Producción diaria vs. capacidad' : `Producción ${e.vista === 'semanal' ? 'semanal' : 'mensual'} vs. capacidad`;
  $('#ley-seri-' + b.id).innerHTML = `<div class="legend">${nombres.map(n => `<span><i style="background:${colores[n]}"></i>${esc(n)}</span>`).join('')}` +
    `<span><i class="linea" style="background:var(--text)"></i>Carga${b.id === 'pasta_plata' ? ' (Indicadores diarios · Vitros PP)' : ''}</span>` +
    (capManual || b.id === 'vitros' ? `<span><i style="background:${COLOR_META}"></i>Capacidad</span>` : '') + '</div>';
  barrasApiladas(cont, filas.map(x => x.item), {...op, sub: true, alto: 260, metaRoja: true, aria: 'Producción vs. capacidad',
    onClick: e.vista === 'semanal' && !zoom ? (it, i) => { const p = periodos[i]; e.zoom = {desde: p.desde, hasta: p.hasta, titulo: `${p.etiqueta} (${fCorta(p.desde)} – ${fCorta(p.hasta)})`}; dibujarBloqueSeri(S, b); } : null,
    lineas: [{vals: filas.map(x => x.carga), color: 'var(--text)', etiquetas: 'todas'}]});
}

let vistaMoldesSerie = 'semanal';

// ---- Fabricación de moldes en el Resumen: histórico de herramentales fabricados (estatus OK por fecha de entrega)
//      con Diario (semana actual) / Semanal (clic = sus días, con la serie diaria de 30 días) / Mensual y mediana.
const BLOQUE_RESUMEN_MOLDES = {
  id: 'rf', titulo: 'Histórico de herramentales fabricados', aria: 'Herramentales fabricados por periodo',
  estado: {vista: 'semanal', zoom: null},
  get op(){ return {orden: ['Molde', 'Galga'], colores: COLOR_HERR, nombres: {Molde: 'Moldes', Galga: 'Galgas'}}; },
  dias(desde, hasta){
    const MO = D.moldes, serie = MO.diaria || [], primero = serie.length ? serie[0].fecha : D.hoy;
    return diasRango(desde, hasta).map(d => {
      const x = serie.find(s => s.fecha === d.iso), futuro = d.iso > D.hoy, segs = (x && x.segs) || {};
      return {etiqueta: d.iso === D.hoy ? t('hoy') : fCorta(d.iso), nombre: fLarga(d.iso), segs, total: x ? x.total : 0, futuro,
              enCurso: d.iso === D.hoy, iso: d.iso, nota: futuro ? '' : d.iso < primero ? 'sin dato' : d.festivo ? 'Festivo' : d.domingo ? 'Domingo' : ''};
    }).filter(x => diaVisible(x.iso, x.total));
  },
  periodos(vista){
    const MO = D.moldes;
    if(vista === 'diaria'){ const l = lunesDe(D.hoy); return this.dias(l, sumarDias(l, 6)); }
    const primero = (MO.diaria && MO.diaria.length) ? MO.diaria[0].fecha : '9999';
    return MO[vista].map(p => {
      const mensual = vista === 'mensual', mes = mensual ? MESES[+p.etiqueta.slice(5) - 1] : '';
      return {etiqueta: mensual ? mes.slice(0, 3) : p.etiqueta.replace('Sem ', 'S'),
              nombre: mensual ? `${mes} ${p.etiqueta.slice(0, 4)}` : `${p.etiqueta} (${fCorta(p.desde)} – ${fCorta(p.hasta)})`,
              segs: p.segs, total: p.total, enCurso: p.en_curso, desde: p.desde, hasta: p.hasta,
              detalle: !mensual && p.desde >= primero};   // el detalle por día existe para los últimos 30 días
    });
  },
  mediana(vista){
    const MO = D.moldes;
    const xs = vista === 'diaria' ? (MO.diaria || []).filter(d => !d.hoy && d.lab).map(d => d.total)
                                  : MO[vista].filter(p => !p.en_curso).map(p => p.total);
    return {valor: medianaDe(xs), unidad: vista === 'diaria' ? 'día laboral' : vista === 'semanal' ? 'semana' : 'mes'};
  },
  dibujar(){ if(D.moldes) dibujarGraficaResumen(this); },
};
BLOQUES_RESUMEN.push(BLOQUE_RESUMEN_MOLDES);

// Moldes en cola para el Resumen: con fecha (por fecha de entrega) y, aparte, los que no tienen fecha establecida
// agrupados por vehículo (las fechas limbo de diciembre las agrupa el servidor en "sin_fecha").
const limboMolde = d => !!d.entrega && d.entrega.slice(5, 7) === '12' && (fecha(d.entrega) - fecha(D.hoy)) / 864e5 > 30;
const sinFechaMolde = d => !d.entrega;
const piezaMolde = d => (d.rep || d.codigo || '').replace(/\s*#\d+\s*$/, '').trim() || '—';
function tarjetaResumenMoldes(MO){
  if(!MO) return `<article class="serv-largo pend"><div class="sl-head"><h3>${t('moldes')}</h3><span class="chip neutral">○ Sin datos de Fila de moldes</span></div></article>`;
  const moldes = (MO.detalle || []).filter(d => d.herramental === 'Molde' && !limboMolde(d));
  const conFecha = moldes.filter(d => !sinFechaMolde(d)).sort((a, b) => a.entrega < b.entrega ? -1 : a.entrega > b.entrega ? 1 : a.vehiculo < b.vehiculo ? -1 : 1);
  const sinFecha = {}; moldes.filter(sinFechaMolde).forEach(d => sinFecha[d.vehiculo] = (sinFecha[d.vehiculo] || 0) + 1);
  (MO.sin_fecha || []).forEach(x => { if(x.moldes) sinFecha[x.vehiculo] = Math.max(sinFecha[x.vehiculo] || 0, x.moldes); });
  const titulo = s => String(s || '').trim();   // el vehículo tal como viene en el Excel
  const chipFecha = iso => { const f = fecha(iso), txt = `${DIAS[f.getDay()]} ${f.getDate()} ${MESES[f.getMonth()].slice(0,3).toLowerCase()}`;
    return iso < D.hoy ? `<span class="mc-f venc">▼ ${txt}</span>` : iso === D.hoy ? `<span class="mc-f hoy">Hoy</span>` : `<span class="mc-f">${txt}</span>`; };
  // agrupados por vehículo, en orden de la entrega más próxima
  const grupos = {}; conFecha.forEach(d => (grupos[d.vehiculo] = grupos[d.vehiculo] || []).push(d));
  const orden = Object.entries(grupos).sort((a, b) => a[1][0].entrega < b[1][0].entrega ? -1 : 1);
  const cuerpo = orden.map(([v, ds]) => `
      <div class="mc-veh"><span>${esc(titulo(v))}</span><span class="mc-n">${fmt(ds.length)} ${ds.length === 1 ? 'molde' : 'moldes'}</span></div>
      ${ds.map(d => `<div class="mc-fila"><span class="num">${esc(piezaMolde(d))}</span>${chipFecha(d.entrega)}</div>`).join('')}`).join('');
  const sinF = Object.entries(sinFecha).map(([v, n]) => `<div class="mc-fila sin"><span>${esc(titulo(v))}</span><span class="mc-set">Set · ${fmt(n)} ${n === 1 ? 'molde' : 'moldes'}</span></div>`).join('');
  return `<article class="serv-largo">
    <div class="sl-head"><h3>${t('moldes')}</h3><span class="ver" data-ir="moldes" tabindex="0">${t('ver_detalle')}</span></div>
    <div class="ra-grid inv">
      ${htmlGraficaResumen(BLOQUE_RESUMEN_MOLDES.id, BLOQUE_RESUMEN_MOLDES.titulo)}
      <div class="kpi ra-chart ra-tabla">
        <div class="lbl"><span>Moldes en cola de fabricación</span><span class="chip neutral">${fmt(conFecha.length)} con fecha${Object.keys(sinFecha).length ? ` · ${fmt(Object.keys(sinFecha).length)} sin fecha` : ''}</span></div>
        <div class="mc">${cuerpo || '<div class="vacio">Sin moldes con fecha de entrega</div>'}
          ${sinF ? `<div class="mc-sec">Desarrollos pendientes por diseño · sin fecha establecida</div>${sinF}` : ''}</div>
      </div>
    </div></article>`;
}

  return `<section class="vista" id="v-moldes" hidden>

function dibujarMoldes(){
  const MO = D && D.moldes; if(!MO || $('#v-moldes').hidden) return;

  const serie = vista === 'diaria' ? MO.diaria.filter(p => diaVisible(p.fecha, p.total)) : MO[vista];
  const nombre = p => vista === 'diaria' ? fLarga(p.fecha) : vista === 'semanal' ? `${p.etiqueta} (${fCorta(p.desde)} – ${fCorta(p.hasta)})` : `${MESES[+p.etiqueta.slice(5)-1]} ${p.etiqueta.slice(0,4)}`;
  const enCurso = p => vista === 'diaria' ? p.hoy : p.en_curso;
  // mediana: días laborales / semanas cerradas / meses cerrados (igual que en mantenimiento)

  const med = medianaDe(base), unidad = vista === 'diaria' ? 'día laboral' : vista === 'semanal' ? 'semana' : 'mes';
  $('#moldes-leyenda').innerHTML = `<div class="legend"><span><i style="background:${COLOR_HERR.Molde}"></i>Moldes</span><span><i style="background:${COLOR_HERR.Galga}"></i>Galgas</span>` +
    (med != null ? `<span><i class="linea punteada" style="color:var(--text)"></i>Mediana por ${unidad}</span>` : '') + '</div>';
  barrasApiladas($('#ch-moldes-serie'), serie.map(p => ({
    etiqueta: vista === 'diaria' ? (p.hoy ? t('hoy') : fCorta(p.fecha)) : vista === 'semanal' ? p.etiqueta.replace('Sem ','S') : MESES[+p.etiqueta.slice(5)-1].slice(0,3),

}

// Cada minuto se pide el tablero; solo se redibuja si algo cambió (firma) y nadie está escribiendo en una casilla.
const enEdicion = () => { const a = document.activeElement; return a && a.tagName === 'INPUT'; };
function conectado(ok){ document.querySelectorAll('.vivo').forEach(v => v.classList.toggle('caido', !ok)); }
async function cargar(forzar=false){
  try {
    const r = await fetch('/api/tablero', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const nuevo = await r.json();
    if(D && !forzar && nuevo.firma === D.firma){
      D.generado = nuevo.generado; D.manuales = nuevo.manuales;
      const b = $('#frescura b'); if(b) b.textContent = fHora(D.generado);
      conectado(true); return;
    }
    if(D && !forzar && enEdicion()) return;
    D = nuevo;
    conectado(true);
    try { render(); }
    catch(e){ console.error(e); $('#main').innerHTML = `<div class="aviso err">✖ <span>Error al dibujar el tablero: ${esc(e.message)}</span><button class="reintentar" onclick="cargar(true)">${t('reintentar')}</button></div>`; }
  } catch(err){
    console.error(err);
    conectado(false);
    if(!D) $('#main').innerHTML = `<div class="aviso err" style="margin-top:30px">✖ <span>${t('error_carga')} (${esc(err.message)})</span><button class="reintentar" onclick="cargar(true)">${t('reintentar')}</button></div>`;
  }
}
setInterval(() => { if(!document.hidden) cargar(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) cargar(); });

  IDIOMA = b.dataset.idioma; guardarPref('tablero-idioma', IDIOMA); aplicarIdioma(); if(D) render();
}));
document.getElementById('btn-tema').addEventListener('click', () => {
  const tema = document.documentElement.dataset.tema === 'claro' ? 'oscuro' : 'claro';
  guardarPref('tablero-tema', tema); aplicarTema(tema); if(D) render();
});

cargar();
</script>
